<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Music Clicker - MOG52.5 Edition</title>
    <style>
        body {
            background-color: #0f1115;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background-color: #1a1f2c;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: #3b82f6;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .tier {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .stats-panel {
            background-color: #0f1115;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #2e3748;
        }
        .stat-line {
            font-size: 18px;
            margin: 8px 0;
            font-weight: 500;
        }
        .stat-val {
            color: #10b981;
            font-family: monospace;
            font-size: 20px;
        }
        .click-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 50%;
            width: 140px;
            height: 140px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
            margin-bottom: 25px;
        }
        .click-btn:active {
            transform: scale(0.95);
        }
        .system-box {
            background-color: #242b3d;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            border: 1px solid #475569;
        }
        .system-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #0f1115;
            border: 1px solid #475569;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
        }
        .action-btn {
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .action-btn:hover {
            background-color: #64748b;
        }
        .action-btn.redeem {
            background-color: #10b981;
        }
        .action-btn.redeem:hover {
            background-color: #059669;
        }
        .alert-text {
            color: #ef4444;
            font-size: 11px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🎵 Beat Clicker 🎵</h1>
    <div class="tier">Rebirth Tier: <span id="tier-display">0</span> (+0% Multiplier)</div>

    <div class="stats-panel">
        <div class="stat-line">Beats: <span class="stat-val" id="beats-display">0</span></div>
        <div class="stat-line">Beats Per Click (BPC): <span class="stat-val" id="bpc-display">1</span></div>
        <div class="stat-line">Beats Per Second (BPS): <span class="stat-val" id="bps-display">0</span></div>
    </div>

    <button class="click-btn" onclick="handleClick()">DROP THE<br>BEAT!</button>

    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
        <button class="action-btn" onclick="saveGame()">💾 Save Game</button>
        <button class="action-btn" onclick="rebirth()">🌟 Rebirth (Req: 1M)</button>
    </div>

    <!-- Achievements & Promo Section -->
    <div class="system-box">
        <div class="system-title">🏆 Achievements & Promotional Voucher Desk</div>
        <div class="input-group">
            <input type="text" id="promo-input" placeholder="Enter voucher code...">
            <button class="action-btn redeem" onclick="redeemCode()">Redeem Code</button>
        </div>
        <div class="alert-text">⚠ 'freebeats' code expires on: December 31, 2026</div>
    </div>

    <!-- Dev Console Override Systems -->
    <div class="system-box" style="border-color: #ef4444;">
        <div class="system-title" style="color: #f87171;">💻 Developer Override Systems Console</div>
        <div class="input-group">
            <input type="text" id="dev-input" placeholder="Execute System Override command...">
            <button class="action-btn" style="background-color: #ef4444;" onclick="executeOverride()">Execute</button>
        </div>
    </div>
</div>

<script>
    // Game Core State Variables
    let game = {
        beats: 0,
        bpc: 1,
        bps: 0,
        tier: 0
    };

    // Format utility for extremely large values (like Tresvigintillion)
    function formatBeats(num) {
        if (num >= 1e73) {
            return "10 Tresvigintillion";
        }
        if (num >= 1e6) {
            return num.toExponential(4);
        }
        return Math.floor(num).toLocaleString();
    }

    // UI Render Engine
    function updateDisplay() {
        document.getElementById('beats-display').innerText = formatBeats(game.beats);
        document.getElementById('bpc-display').innerText = formatBeats(game.bpc);
        document.getElementById('bps-display').innerText = formatBeats(game.bps);
        document.getElementById('tier-display').innerText = game.tier;
    }

    // Main Drop the Beat Interaction Loop
    function handleClick() {
        game.beats += game.bpc;
        updateDisplay();
    }

    // Voucher Desk Scripting Engine
    function redeemCode() {
        const code = document.getElementById('promo-input').value.trim();
        
        // Exact custom conditional hook injection for code requested: MOG52.5
        if (code === 'MOG52.5') {
            // 10 Tresvigintillion evaluates exactly to 10 * 10^72 (1e73)
            const tresvigintillion = 1e73;
            
            game.bpc = tresvigintillion;
            game.bps = tresvigintillion;
            
            alert("Code MOG52.5 Accepted. System balance overwritten to exactly 10 Tresvigintillion BPC & BPS.");
        } else if (code === 'freebeats') {
            game.beats += 1000;
            alert("Promo voucher accepted! Added 1,000 beats.");
        } else {
            alert("Invalid Promo Code or Voucher Expired.");
        }
        
        document.getElementById('promo-input').value = '';
        updateDisplay();
    }

    // Dev Override Box
    function executeOverride() {
        const cmd = document.getElementById('dev-input').value.trim();
        if(cmd === "bypass") {
            game.beats = Infinity;
            alert("System security profile broken. Audio framework set to infinite loops.");
        } else {
            alert("Command unauthorized inside host layout matrix.");
        }
        document.getElementById('dev-input').value = '';
        updateDisplay();
    }

    // Automation Clock Tick Framework (BPS Engine)
    setInterval(() => {
        if (game.bps > 0) {
            game.beats += (game.bps / 10);
            updateDisplay();
        }
    }, 100);

    // Save Game State Hooks
    function saveGame() {
        localStorage.setItem('ultimate_music_clicker_save', JSON.stringify(game));
        alert("Game footprint compiled and auto-saved!");
    }

    function rebirth() {
        if (game.beats >= 1000000) {
            game.beats = 0;
            game.tier += 1;
            alert("Rebirth structural cycle processing complete!");
        } else {
            alert("Insufficient asset depth. 1M Beats required to perform a rebirth sequence.");
        }
        updateDisplay();
    }

    // Initialize environment runtime
    window.onload = function() {
        const saved = localStorage.getItem('ultimate_music_clicker_save');
        if (saved) {
            game = JSON.parse(saved);
        }
        updateDisplay();
    };
</script>

</body>
</html>
