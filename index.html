<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Music Clicker</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #ffffff;
            --accent-color: #e94560;
            --panel-bg: #16213e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease;
        }

        body.matrix-mode {
            --bg-color: #000000;
            --text-color: #00ff00;
            --accent-color: #008f11;
            --panel-bg: #0d1f0d;
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .score-display {
            font-size: 2.5rem;
            margin: 20px 0;
            font-weight: bold;
        }

        .stats-display {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1rem;
        }

        .click-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .matrix-mode .click-btn {
            color: #00ff00;
            border: 2px solid #00ff00;
            background: transparent;
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }

        .upgrade-item:last-child {
            border-bottom: none;
        }

        .buy-btn {
            background-color: #0f3460;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .matrix-mode .buy-btn {
            border: 1px solid #00ff00;
            background: transparent;
            color: #00ff00;
        }

        .buy-btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .matrix-mode .buy-btn:disabled {
            border: 1px solid #224422;
            color: #224422;
        }

        .secret-input {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
        }

        .back-btn {
            display: none;
            margin-top: 20px;
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="game-title">🎵 Beat Clicker 🎵</h1>
        
        <div class="score-display"><span id="score-label">Beats</span>: <span id="score">0</span></div>
        
        <div class="stats-display">
            <div><span id="bps-label">BPS</span>: <span id="bps">0</span></div>
            <div>Click Value: +<span id="click-val">1</span></div>
        </div>
        
        <button class="click-btn" id="click-trigger" onclick="clickBeats()">DROP THE BEAT!</button>

        <div class="panel">
            <h3 id="shop-title">Buy & Unlock Background Tracks</h3>
            <div id="upgrades-container"></div>
        </div>

        <div id="secret-section">
            <p>Enter Secret Code:</p>
            <input type="password" id="matrix-code" class="secret-input" placeholder="???" oninput="checkCode()">
        </div>

        <button id="back-button" class="back-btn" onclick="exitMatrixMode()">⬅ Go Back to Reality</button>
    </div>

    <script>
        let score = 0;
        let beatsPerSecond = 0;
        let baseClickValue = 1;
        let synthCtx = null;

        // NORMAL MODE SHOP UPGRADES
        const normalUpgrades = [
            { id: "click1", name: "Heavy Duty Drumstick", cost: 10, amount: 1, type: "click", count: 0, desc: "+1 Per Click" },
            { id: "click2", name: "Amplified Subwoofer", cost: 150, amount: 10, type: "click", count: 0, desc: "+10 Per Click" },
            { id: "bps1", name: "Lo-Fi Background Hum", cost: 25, amount: 1, type: "bps", count: 0, desc: "+1 BPS" },
            { id: "bps2", name: "Synthwave Bassline", cost: 250, amount: 8, type: "bps", count: 0, desc: "+8 BPS" },
            { id: "bps3", name: "Orchestral Drop Combo", cost: 2000, amount: 50, type: "bps", count: 0, desc: "+50 BPS" }
        ];

        // MATRIX MODE SHOP UPGRADES (Changes completely when 999 is entered)
        const matrixUpgrades = [
            { id: "mclick1", name: "Brute-Force Exploit", cost: 50, amount: 25, type: "click", count: 0, desc: "+25 Per Click" },
            { id: "mclick2", name: "Quantum Rig Overclock", cost: 500, amount: 200, type: "click", count: 0, desc: "+200 Per Click" },
            { id: "mbps1", name: "Distributed Botnet Worm", cost: 100, amount: 20, type: "bps", count: 0, desc: "+20 BPS" },
            { id: "mbps2", name: "Mainframe Proxy Breach", cost: 1000, amount: 150, type: "bps", count: 0, desc: "+150 BPS" },
            { id: "mbps3", name: "AI Core Singularity Override", cost: 15000, amount: 1200, type: "bps", count: 0, desc: "+1200 BPS" }
        ];

        function getActiveUpgrades() {
            return document.body.classList.contains('matrix-mode') ? matrixUpgrades : normalUpgrades;
        }

        function initGame() {
            const container = document.getElementById('upgrades-container');
            container.innerHTML = '';
            
            const currentList = getActiveUpgrades();
            
            currentList.forEach(up => {
                container.innerHTML += `
                    <div class="upgrade-item" id="item-${up.id}">
                        <div>
                            <strong>${up.name}</strong><br>
                            <small>${up.desc} | Owned: <span id="count-${up.id}">${up.count}</span></small>
                        </div>
                        <button class="buy-btn" id="btn-${up.id}" onclick="buyUpgrade('${up.id}')">
                            Cost: ${up.cost}
                        </button>
                    </div>
                `;
            });
            updateUI();
        }

        function playClickSound(freq, duration) {
            try {
                if (!synthCtx) {
                    synthCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                let osc = synthCtx.createOscillator();
                let gain = synthCtx.createGain();
                
                osc.type = document.body.classList.contains('matrix-mode') ? 'sawtooth' : 'sine';
                osc.frequency.setValueAtTime(freq, synthCtx.currentTime);
                if(document.body.classList.contains('matrix-mode')) {
                    osc.frequency.exponentialRampToValueAtTime(freq / 2, synthCtx.currentTime + duration);
                }
                
                gain.gain.setValueAtTime(0.2, synthCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, synthCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(synthCtx.destination);
                
                osc.start();
                osc.stop(synthCtx.currentTime + duration);
            } catch (e) {}
        }

        function clickBeats() {
            playClickSound(document.body.classList.contains('matrix-mode') ? 220 : 600, 0.05);
            
            // Calculate current total clicking worth
            let clickPower = baseClickValue;
            const currentList = getActiveUpgrades();
            
            currentList.forEach(up => {
                if(up.type === "click") {
                    clickPower += (up.count * up.amount);
                }
            });

            score += clickPower;
            updateUI();
        }

        function buyUpgrade(id) {
            const currentList = getActiveUpgrades();
            const upgrade = currentList.find(up => up.id === id);
            
            if (score >= upgrade.cost) {
                score -= upgrade.cost;
                upgrade.count++;
                upgrade.cost = Math.floor(upgrade.cost * 1.20); // Scale cost by 20%
                
                playClickSound(880, 0.12);
                calculateStats();
                updateUI();
            }
        }

        function calculateStats() {
            let currentList = getActiveUpgrades();
            
            // Calculate Background BPS
            beatsPerSecond = currentList.reduce((total, up) => {
                return up.type === "bps" ? total + (up.count * up.amount) : total;
            }, 0);

            // Display current click engine strength
            let clickPower = baseClickValue;
