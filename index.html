<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Music Clicker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: none;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .stats-panel, .achievements-panel, .card, .secret-code-section {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(5px);
            border: 1px solid #333;
            transition: all 0.3s;
        }

        body.matrix-active .stats-panel, 
        body.matrix-active .achievements-panel, 
        body.matrix-active .card, 
        body.matrix-active .secret-code-section {
            background-color: rgba(10, 25, 10, 0.85);
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        body.matrix-active h1 {
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        body.matrix-active .section-title {
            color: #00ff00;
        }

        .stats-panel {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .stat {
            font-size: 1.2rem;
            margin: 5px 0;
        }

        #score {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00f0ff;
        }
        body.matrix-active #score {
            color: #00ff00;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .click-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        body.matrix-active .click-btn {
            background: linear-gradient(45deg, #00ff00, #008800);
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.4);
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .action-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .action-btn:hover:not(:disabled) {
            background-color: #ff007f;
            border-color: #ff007f;
        }
        body.matrix-active .action-btn:hover:not(:disabled) {
            background-color: #00ff00;
            border-color: #00ff00;
            color: #000;
        }

        .action-btn:disabled {
            background-color: #222;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        #rebirthBtn {
            border-color: #ffd700;
            color: #ffd700;
        }
        #rebirthBtn:hover:not(:disabled) {
            background-color: #ffd700;
            color: black;
        }

        .section-title {
            color: #00f0ff;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-top: 30px;
            text-align: left;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h4 {
            margin: 0 0 5px 0;
            color: #fff;
        }

        .card p {
            margin: 5px 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        .card button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .card button:hover:not(:disabled) {
            background-color: #ff007f;
            border-color: #ff007f;
        }
        body.matrix-active .card button:hover:not(:disabled) {
            background-color: #00ff00;
            border-color: #00ff00;
            color: #000;
        }

        .card button:disabled {
            background-color: #222;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        .achievements-panel {
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            width: 100%;
            box-sizing: border-box;
        }

        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .achievement-item {
            padding: 10px;
            border-radius: 6px;
            background-color: #111;
            border-left: 4px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achievement-item.unlocked {
            border-left-color: #00f0ff;
            background-color: #16222f;
        }
        body.matrix-active .achievement-item.unlocked {
            border-left-color: #00ff00;
            background-color: #102510;
        }

        .achievement-status {
            font-weight: bold;
            font-size: 0.85rem;
            color: #555;
        }

        .achievement-item.unlocked .achievement-status {
            color: #00f0ff;
        }
        body.matrix-active .achievement-item.unlocked .achievement-status {
            color: #00ff00;
        }

        .secret-code-section {
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 15px;
            border-radius: 8px;
        }

        .secret-code-section input {
            background-color: #111;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            margin-right: 10px;
        }

        .secret-code-section button {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="container">
    <h1 id="gameTitle">🎵 Beat Clicker 🎵</h1>

    <div class="stats-panel">
        <div class="stat">Beats: <span id="score">0</span></div>
        <div class="stat">Beats Per Click (BPC): <span id="bpc">1</span></div>
        <div class="stat">Beats Per Second (BPS): <span id="bps">0</span></div>
        <div class="stat" style="color: #ffd700; font-weight: bold;">Rebirths: <span id="rebirthsDisplay">0</span> (Multiplier: <span id="multDisplay">1</span>x)</div>
    </div>

    <div class="btn-container">
        <button class="click-btn" id="clickBtn">DROP THE BEAT!</button>
        <button class="action-btn" id="saveBtn">💾 SAVE GAME</button>
        <button class="action-btn" id="rebirthBtn" disabled>🌟 REBIRTH<br><span id="rebirthCostText" style="font-size:0.75rem;">(Cost: 1,000,000)</span></button>
    </div>

    <div class="achievements-panel">
        <h3 style="margin-top: 0; color: #00f0ff; text-align: left;" id="achHeader">🏆 Achievements</h3>
        <div class="achievement-list" id="achievementsList"></div>
    </div>

    <h3 class="section-title">Buy & Unlock Clicking Upgrades</h3>
    <div class="grid" id="clickingUpgrades"></div>

    <h3 class="section-title">Buy & Unlock Background Tracks</h3>
    <div class="grid" id="backgroundTracks"></div>

    <div class="secret-code-section">
        <label for="secretCode">Enter Secret Code:</label><br><br>
        <input type="text" id="secretCode" placeholder="Code...">
        <button id="submitCode">Submit</button>
    </div>

    <a href="#" class="back-link">⬅ Go Back to Reality</a>
</div>

<script>
    // Game State
    let state = {
        beats: 0,
        bpc: 1,
        bps: 0,
        totalTracksBought: 0,
        rebirths: 0,
        matrixActive: false
    };

    // Base Configurations (Deep copy values during reset)
    const baseClickingUpgrades = [
        { id: 'bpc_1', name: 'Heavy Drumsticks', effect: 1, cost: 10, owned: 0 },
        { id: 'bpc_2', name: 'Amplified Mouse', effect: 5, cost: 80, owned: 0 },
        { id: 'bpc_3', name: 'Macro Beat Generator', effect: 20, cost: 400, owned: 0 },
        { id: 'bpc_4', name: 'Quantum Tap Engine', effect: 100, cost: 2500, owned: 0 },
        { id: 'bpc_5', name: 'Singularity Clicker', effect: 500, cost: 15000, owned: 0 },
        { id: 'bpc_6', name: 'Cosmic Tap Catalyst', effect: 2500, cost: 90000, owned: 0 },
        { id: 'bpc_7', name: 'Dimensional Rhythm Warp', effect: 10000, cost: 550000, owned: 0 },
        { id: 'bpc_8', name: 'Chrono Beat Fracturer', effect: 50000, cost: 3500000, owned: 0 },
        { id: 'bpc_9', name: 'Dark Matter Pulsator', effect: 250000, cost: 24000000, owned: 0 },
        { id: 'bpc_10', name: 'Infinity Drum', effect: 1000000, cost: 180000000, owned: 0 }
    ];

    const baseBackgroundTracks = [
        { id: 'bps_1', name: 'Upbeat Synth Theme', effect: 1, cost: 15, owned: 0 },
        { id: 'bps_2', name: 'Acoustic Funk Groove', effect: 5, cost: 100, owned: 0 },
        { id: 'bps_3', name: 'Club Techno Pulse', effect: 25, cost: 500, owned: 0 },
        { id: 'bps_4', name: 'Fast Breakbeat Energy', effect: 100, cost: 3000, owned: 0 },
        { id: 'bps_5', name: 'Cyber Arpeggio Overdrive', effect: 500, cost: 10000, owned: 0 },
        { id: 'bps_6', name: 'Hypersonic Remix', effect: 2500, cost: 60000, owned: 0 },
        { id: 'bps_7', name: 'Galactic Symphony', effect: 10000, cost: 350000, owned: 0 },
        { id: 'bps_8', name: 'Time-Warp Continuum', effect: 50000, cost: 2000000, owned: 0 },
        { id: 'bps_9', name: 'Multiverse Bassline', effect: 250000, cost: 15000000, owned: 0 },
        { id: 'bps_10', name: 'Omniverse Masterpiece', effect: 1000000, cost: 100000000, owned: 0 },
        { id: 'bps_11', name: 'Astral Harmony', effect: 5000000, cost: 750000000, owned: 0 },
        { id: 'bps_12', name: 'Supernova Baseline', effect: 25000000, cost: 4000000000, owned: 0 },
        { id: 'bps_13', name: 'Infinity Symphony', effect: 100000000, cost: 25000000000, owned: 0 },
        { id: 'bps_14', name: 'Reality Tear Remix', effect: 500000000, cost: 150000000000, owned: 0 },
        { id: 'bps_15', name: 'Cosmic Overlord Anthem', effect: 2500000000, cost: 1000000000000 }
    ];

    let clickingUpgrades = JSON.parse(JSON.stringify(baseClickingUpgrades));
    let backgroundTracks = JSON.parse(JSON.stringify(baseBackgroundTracks));

    const achievements = [
        { id: 'ach_1', name: 'First Beat', desc: 'Reach 1 total beat', unlocked: false, condition: () => state.beats >= 1 },
        { id: 'ach_2', name: 'Getting Groovy', desc: 'Reach 100 total beats', unlocked: false, condition: () => state.beats >= 100 },
        { id: 'ach_3', name: 'Studio Producer', desc: 'Reach 10,000 total beats', unlocked: false, condition: () => state.beats >= 10000 },
        { id: 'ach_4', name: 'Beat Master', desc: 'Purchase your first background track', unlocked: false, condition: () => state.totalTracksBought >= 1 },
        { id: 'ach_5', name: 'Click Elite', desc: 'Reach 50 Beats Per Click (BPC)', unlocked: false, condition: () => state.bpc >= 50 }
    ];

    // Rebirth Config
    const baseRebirthCost = 1000000;
    function getRebirthCost() {
        return baseRebirthCost * Math.pow(5, state.rebirths);
    }
    function getRebirthMultiplier() {
        return 1 + (state.rebirths * 2); // Each rebirth yields +200% bonus multiplier (1x -> 3x -> 5x etc.)
    }

    // DOM Elements
    const scoreEl = document.getElementById('score');
    const bpcEl = document.getElementById('bpc');
    const bpsEl = document.getElementById('bps');
    const rebirthsDisplay = document.getElementById('rebirthsDisplay');
    const multDisplay = document.getElementById('multDisplay');
    const clickBtn = document.getElementById('clickBtn');
    const saveBtn = document.getElementById('saveBtn');
    const rebirthBtn = document.getElementById('rebirthBtn');
    const rebirthCostText = document.getElementById('rebirthCostText');
    const clickingUpgradesContainer = document.getElementById('clickingUpgrades');
    const backgroundTracksContainer = document.getElementById('backgroundTracks');
    const achievementsListContainer = document.getElementById('achievementsList');
    const secretCodeInput = document.getElementById('secretCode');
    const submitCodeBtn = document.getElementById('submitCode');
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    // Matrix Rain Variables
    let columns = [];
    const fontSize = 16;
    let matrixInterval = null;

    function formatNum(num) {
        return num.toLocaleString();
    }

    function initUI() {
        clickingUpgradesContainer.innerHTML = clickingUpgrades.map((upg, idx) => `
            <div class="card" id="card-${upg.id}">
                <div>
                    <h4>${upg.name}</h4>
                    <p>Gives +${formatNum(upg.effect)} BPC</p>
                    <p>Owned: <span id="owned-${upg.id}">0</span></p>
                </div>
                <button id="btn-${upg.id}" onclick="buyClickingUpgrade(${idx})">Cost: ${formatNum(upg.cost)}</button>
            </div>
        `).join('');

        backgroundTracksContainer.innerHTML = backgroundTracks.map((track, idx) => `
            <div class="card" id="card-${track.id}">
                <div>
                    <h4>${track.name}</h4>
                    <p>Gives +${formatNum(track.effect)} BPS</p>
                    <p>Owned: <span id="owned-${track.id}">0</span></p>
                </div>
                <button id="btn-${track.id}" onclick="buyBackgroundTrack(${idx})">Cost: ${formatNum(track.cost)}</button>
            </div>
        `).join('');

        renderAchievements();
        loadGame(); // Pull local storage if it exists
        updateUI();
    }

    function renderAchievements() {
        achievementsListContainer.innerHTML = achievements.map(ach => `
            <div class="achievement-item ${ach.unlocked ? 'unlocked' : ''}" id="${ach.id}">
                <div>
                    <strong>${ach.name}</strong> - <span style="color: #aaa; font-size: 0.9rem;">${ach.desc}</span>
                </div>
                <div class="achievement-status">${ach.unlocked ? '🔓 UNLOCKED' : '🔒 LOCKED'}</div>
            </div>
        `).join('');
    }

    function updateUI() {
        scoreEl.innerText = formatNum(state.beats);
        bpcEl.innerText = formatNum(state.bpc);
        bpsEl.innerText = formatNum(state.bps);
        rebirthsDisplay.innerText = formatNum(state.rebirths);
        multDisplay.innerText = formatNum(getRebirthMultiplier());

        const currentRebirthCost = getRebirthCost();
        rebirthCostText.innerText = `(Cost: ${formatNum(currentRebirthCost)})`;
        rebirthBtn.disabled = state.beats < currentRebirthCost;

        clickingUpgrades.forEach(upg => {
            const btn = document.getElementById(`btn-${upg.id}`);
            const ownedEl = document.getElementById(`owned-${upg.id}`);
            if(ownedEl) ownedEl.innerText = upg.owned;
            if(btn) {
                btn.innerText = `Cost: ${formatNum(upg.cost)}`;
                btn.disabled = state.beats < upg.cost;
            }
        });

        backgroundTracks.forEach(track => {
            const btn = document.getElementById(`btn-${track.id}`);
            const ownedEl = document.getElementById(`owned-${track.id}`);
            if(ownedEl) ownedEl.innerText = track.owned;
            if(btn) {
                btn.innerText = `Cost: ${formatNum(track.cost)}`;
                btn.disabled = state.beats < track.cost;
            }
        });

        if (state.matrixActive) {
            activateMatrixVisuals();
        }

        checkAchievements();
    }

    function checkAchievements() {
        let stateChanged = false;
        achievements.forEach(ach => {
            if (!ach.unlocked && ach.condition()) {
                ach.unlocked = true;
                stateChanged = true;
            }
        });
        if (stateChanged) {
            renderAchievements();
        }
    }

    // Gameplay Loops
    clickBtn.addEventListener('click', () => {
        state.beats += state.bpc * getRebirthMultiplier();
        updateUI();
    });

    window.buyClickingUpgrade = function(index) {
        const upg = clickingUpgrades[index];
        if (state.beats >= upg.cost) {
            state.beats -= upg.cost;
            upg.owned++;
            state.bpc += upg.effect;
            upg.cost = Math.round(upg.cost * 1.15);
            updateUI();
        }
    };

    window.buyBackgroundTrack = function(index) {
        const track = backgroundTracks[index];
        if (state.beats >= track.cost) {
            state.beats -= track.cost;
            track.owned++;
            state.bps += track.effect;
            state.totalTracksBought++;
            track.cost = Math.round(track.cost * 1.15);
            updateUI();
        }
    };

    // Save Mechanics
    saveBtn.addEventListener('click', () => {
        const saveData = {
            state: state,
            clickingUpgrades: clickingUpgrades,
            backgroundTracks: backgroundTracks,
            achievements: achievements.map(a => ({ id: a.id, unlocked: a.unlocked }))
        };
        localStorage.setItem('beatClickerSave', JSON.stringify(saveData));
        
        const originalText = saveBtn.innerText;
        saveBtn.innerText = "✅ SAVED!";
        setTimeout(() => saveBtn.innerText = originalText, 1500);
    });

    function loadGame() {
        const saved = localStorage.getItem('beatClickerSave');
        if (!saved) return;
        try {
            const parsed = JSON.parse(saved);
            state = parsed.state;
            clickingUpgrades = parsed.clickingUpgrades;
            backgroundTracks = parsed.backgroundTracks;
            
            parsed.achievements.forEach(savedAch => {
                const match = achievements.find(a => a.id === savedAch.id);
                if (match) match.unlocked = savedAch.unlocked;
            });
        } catch(e) {
            console.error("Could not load save file", e);
        }
    }

    // Rebirth Feature Execution
    rebirthBtn.addEventListener('click', () => {
        const currentCost = getRebirthCost();
        if (state.beats >= currentCost) {
            state.rebirths++;
            
            // Hard wipe resources & upgrades back to default layout
            state.beats = 0;
            state.bpc = 1;
            state.bps = 0;
            state.totalTracksBought = 0;
            
            clickingUpgrades = JSON.parse(JSON.stringify(baseClickingUpgrades));
            backgroundTracks = JSON.parse(JSON.stringify(baseBackgroundTracks));
            
            alert(`🌟 Rebirth successful! You have entered Rebirth Tier ${state.rebirths}. Your clicking generation gains an extra permanent multiplier!`);
            initUI();
        }
    });

    // Code Matrix Rain Implementation
    function initMatrix() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const numColumns = Math.floor(canvas.width / fontSize);
        columns = Array(numColumns).fill(1);
    }

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < columns.length; i++) {
            const text = String.fromCharCode(Math.floor(Math.random() * 96) + 33);
            const x = i * fontSize;
            const y = columns[i] * fontSize;

            ctx.fillText(text, x, y);

            if (y > canvas.height && Math.random() > 0.975) {
                columns[i] = 0;
            }
            columns[i]++;
        }
    }

    function activateMatrixVisuals() {
        document.body.classList.add('matrix-active');
        canvas.style.display = 'block';
        if (!matrixInterval) {
            initMatrix();
            window.addEventListener('resize', initMatrix);
            matrixInterval = setInterval(drawMatrix, 33);
        }
    }

    // Cheats Panel
    submitCodeBtn.addEventListener('click', () => {
        const code = secretCodeInput.value.trim();
        const codeLower = code.toLowerCase();

        if (codeLower === 'freebeats') {
            state.beats += 5000;
            alert('Code accepted! Added 5,000 beats.');
        } else if (codeLower === 'm4tr1x') {
            state.bpc += 500;
            state.matrixActive = true;
            activateMatrixVisuals();
            alert('Raining code activated... Matrix grid built. +500 BPC granted.');
        } else if (code === 'ACXx!11111') {
            state.bpc += 50000000;
            state.bps += 1000000000;
            alert('GOD TIERS UNLOCKED! +50,000,000 BPC and +1,000,000,000 BPS added directly to core engine.');
        } else {
            alert('Invalid secret code.');
        }
        secretCodeInput.value = '';
        updateUI();
    });

    secretCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitCodeBtn.click();
    });

    // Engine generation
    setInterval(() => {
        if (state.bps > 0) {
            state.beats += (state.bps * getRebirthMultiplier());
            updateUI();
        }
    }, 1000);

    initUI();
</script>

</body>
</html>
