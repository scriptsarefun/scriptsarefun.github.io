<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Music Clicker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: none;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .stats-panel, .achievements-panel, .section-box, .secret-code-section {
            background-color: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
            transition: background 0.3s, border 0.3s;
        }

        body.matrix-active .stats-panel,
        body.matrix-active .achievements-panel,
        body.matrix-active .section-box,
        body.matrix-active .secret-code-section,
        body.matrix-active .card {
            background-color: rgba(10, 25, 10, 0.85);
            border: 1px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .stat {
            font-size: 1.2rem;
            margin: 5px 0;
        }

        #score {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00f0ff;
        }
        body.matrix-active #score {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .click-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        body.matrix-active .click-btn {
            background: linear-gradient(45deg, #00ff00, #003300);
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.4);
            color: #fff;
        }

        .action-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .action-btn:hover:not(:disabled) {
            background-color: #ff007f;
        }
        .action-btn:disabled {
            background-color: #1a1a1a;
            color: #444;
            border-color: #222;
            cursor: not-allowed;
        }
        body.matrix-active .action-btn:hover:not(:disabled) {
            background-color: #00ff00;
            color: #000;
        }

        .section-title {
            color: #00f0ff;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-top: 10px;
            text-align: left;
        }
        body.matrix-active .section-title {
            color: #00ff00;
            border-bottom-color: #00ff00;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: rgba(30, 30, 30, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h4 {
            margin: 0 0 5px 0;
            color: #fff;
        }

        .card p {
            margin: 5px 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        .card button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .card button:hover:not(:disabled) {
            background-color: #ff007f;
            border-color: #ff007f;
        }

        .card button:disabled {
            background-color: #222;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .achievement-item {
            padding: 10px;
            border-radius: 6px;
            background-color: #111;
            border-left: 4px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achievement-item.unlocked {
            border-left-color: #00f0ff;
            background-color: #16222f;
        }
        body.matrix-active .achievement-item.unlocked {
            border-left-color: #00ff00;
            background-color: #0b1a0b;
        }

        .achievement-status {
            font-weight: bold;
            font-size: 0.85rem;
            color: #555;
        }

        .achievement-item.unlocked .achievement-status {
            color: #00f0ff;
        }
        body.matrix-active .achievement-item.unlocked .achievement-status {
            color: #00ff00;
        }

        .secret-code-section input, .section-box select {
            background-color: #111;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
        }
        body.matrix-active .secret-code-section input, body.matrix-active .section-box select {
            border-color: #00ff00;
            color: #00ff00;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="container">
    <h1>🎵 Beat Clicker 🎵</h1>

    <div class="stats-panel">
        <div class="stat">Beats: <span id="score">0</span></div>
        <div class="stat">Beats Per Click (BPC): <span id="bpc">1</span></div>
        <div class="stat">Beats Per Second (BPS): <span id="bps">0</span></div>
        <div class="stat" id="rebirthStat" style="display:none; color: #ffca28; font-weight: bold;">Rebirth Tier: <span id="rebirthTier">0</span> (+<span id="rebirthMultiplier">0</span>% Boost)</div>
    </div>

    <div class="btn-container">
        <button class="click-btn" id="clickBtn">DROP THE BEAT!</button>
        <button class="action-btn" id="saveBtn">💾 Save Game</button>
        <button class="action-btn" id="rebirthBtn" disabled>🌟 Rebirth (Req: 1,000,000)</button>
    </div>

    <div class="section-box" style="text-align: left;">
        <h3 style="margin-top:0; color: #ff007f;" id="instrumentHeader">🎷 Instruments Section</h3>
        <label for="instrumentSelect">Active Instrument:</label>
        <select id="instrumentSelect">
            <option value="mute">Mute / Electronic Sync</option>
            <option value="drumsticks" selected>Wooden Drumsticks</option>
        </select>
    </div>

    <div class="achievements-panel">
        <h3 style="margin-top: 0; color: #00f0ff; text-align: left;">🏆 Achievements</h3>
        <div class="achievement-list" id="achievementsList"></div>
    </div>

    <div class="section-box">
        <h3 class="section-title">Buy & Unlock Clicking Upgrades</h3>
        <div class="grid" id="clickingUpgrades"></div>
    </div>

    <div class="section-box">
        <h3 class="section-title">Buy & Unlock Background Tracks</h3>
        <div class="grid" id="backgroundTracks"></div>
    </div>

    <div class="secret-code-section">
        <label for="secretCode">Enter Secret Code:</label><br><br>
        <input type="text" id="secretCode" placeholder="Code...">
        <button class="action-btn" id="submitCode" style="padding: 6px 15px;">Submit</button>
    </div>

    <div class="back-link" id="realityBtn">⬅ Go Back to Reality</div>
</div>

<script>
    // Audio Context Setup
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playDrumstickSound() {
        try {
            initAudio();
            if (!audioCtx || audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {
            console.log("Audio failed to play context window lock:", e);
        }
    }

    // Game Core State
    let state = {
        beats: 0,
        bpc: 1,
        bps: 0,
        totalTracksBought: 0,
        rebirths: 0,
        cheatBpc: 0,
        cheatBps: 0,
        matrixUnlocked: false
    };

    const clickingUpgrades = [
        { id: 'bpc_1', name: 'Heavy Drumsticks', effect: 1, cost: 10, owned: 0 },
        { id: 'bpc_2', name: 'Amplified Mouse', effect: 5, cost: 80, owned: 0 },
        { id: 'bpc_3', name: 'Macro Beat Generator', effect: 20, cost: 400, owned: 0 },
        { id: 'bpc_4', name: 'Quantum Tap Engine', effect: 100, cost: 2500, owned: 0 },
        { id: 'bpc_5', name: 'Singularity Clicker', effect: 500, cost: 15000, owned: 0 },
        { id: 'bpc_6', name: 'Cosmic Tap Catalyst', effect: 2500, cost: 90000, owned: 0 },
        { id: 'bpc_7', name: 'Dimensional Rhythm Warp', effect: 10000, cost: 550000, owned: 0 },
        { id: 'bpc_8', name: 'Chrono Beat Fracturer', effect: 50000, cost: 3500000, owned: 0 },
        { id: 'bpc_9', name: 'Dark Matter Pulsator', effect: 250000, cost: 24000000, owned: 0 },
        { id: 'bpc_10', name: 'Infinity Drum', effect: 1000000, cost: 180000000, owned: 0 }
    ];

    const backgroundTracks = [
        { id: 'bps_1', name: 'Upbeat Synth Theme', effect: 1, cost: 15, owned: 0 },
        { id: 'bps_2', name: 'Acoustic Funk Groove', effect: 5, cost: 100, owned: 0 },
        { id: 'bps_3', name: 'Club Techno Pulse', effect: 25, cost: 500, owned: 0 },
        { id: 'bps_4', name: 'Fast Breakbeat Energy', effect: 100, cost: 3000, owned: 0 },
        { id: 'bps_5', name: 'Cyber Arpeggio Overdrive', effect: 500, cost: 10000, owned: 0 },
        { id: 'bps_6', name: 'Hypersonic Remix', effect: 2500, cost: 60000, owned: 0 },
        { id: 'bps_7', name: 'Galactic Symphony', effect: 10000, cost: 350000, owned: 0 },
        { id: 'bps_8', name: 'Time-Warp Continuum', effect: 50000, cost: 2000000, owned: 0 },
        { id: 'bps_9', name: 'Multiverse Bassline', effect: 250000, cost: 15000000, owned: 0 },
        { id: 'bps_10', name: 'Omniverse Masterpiece', effect: 1000000, cost: 100000000, owned: 0 }
    ];

    const achievements = [
        { id: 'ach_1', name: 'First Beat', desc: 'Reach 1 total beat', unlocked: false, condition: () => state.beats >= 1 },
        { id: 'ach_2', name: 'Getting Groovy', desc: 'Reach 100 total beats', unlocked: false, condition: () => state.beats >= 100 },
        { id: 'ach_3', name: 'Studio Producer', desc: 'Reach 10,000 total beats', unlocked: false, condition: () => state.beats >= 10000 },
        { id: 'ach_4', name: 'Beat Master', desc: 'Purchase your first background track', unlocked: false, condition: () => state.totalTracksBought >= 1 },
        { id: 'ach_5', name: 'Click Elite', desc: 'Reach 50 Base BPC', unlocked: false, condition: () => state.bpc >= 50 }
    ];

    const scoreEl = document.getElementById('score');
    const bpcEl = document.getElementById('bpc');
    const bpsEl = document.getElementById('bps');
    const clickBtn = document.getElementById('clickBtn');
    const saveBtn = document.getElementById('saveBtn');
    const rebirthBtn = document.getElementById('rebirthBtn');
    const rebirthStat = document.getElementById('rebirthStat');
    const rebirthTierEl = document.getElementById('rebirthTier');
    const rebirthMultiplierEl = document.getElementById('rebirthMultiplier');
    const instrumentSelect = document.getElementById('instrumentSelect');
    const clickingUpgradesContainer = document.getElementById('clickingUpgrades');
    const backgroundTracksContainer = document.getElementById('backgroundTracks');
    const achievementsListContainer = document.getElementById('achievementsList');
    const secretCodeInput = document.getElementById('secretCode');
    const submitCodeBtn = document.getElementById('submitCode');
    const realityBtn = document.getElementById('realityBtn');
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    let matrixInterval = null;
    let alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*()_+-=";
    let fontSize = 16;
    let columns = 0;
    let rainDrops = [];

    function initMatrixRain() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize);
        rainDrops = Array(columns).fill(1);
    }

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0F0';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
            let text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
            ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

            if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    }

    window.addEventListener('resize', () => {
        if (state.matrixUnlocked) initMatrixRain();
    });

    function formatNum(num) {
        return num.toLocaleString();
    }

    function initUI() {
        clickingUpgradesContainer.innerHTML = clickingUpgrades.map((upg, idx) => `
            <div class="card" id="card-${upg.id}">
                <div>
                    <h4>${upg.name}</h4>
                    <p>Gives +${formatNum(upg.effect)} BPC</p>
                    <p>Owned: <span id="owned-${upg.id}">0</span></p>
                </div>
                <button id="btn-${upg.id}" onclick="buyClickingUpgrade(${idx})">Cost: ${formatNum(upg.cost)}</button>
            </div>
        `).join('');

        backgroundTracksContainer.innerHTML = backgroundTracks.map((track, idx) => `
            <div class="card" id="card-${track.id}">
                <div>
                    <h4>${track.name}</h4>
                    <p>Gives +${formatNum(track.effect)} BPS</p>
                    <p>Owned: <span id="owned-${track.id}">0</span></p>
                </div>
                <button id="btn-${track.id}" onclick="buyBackgroundTrack(${idx})">Cost: ${formatNum(track.cost)}</button>
            </div>
        `).join('');

        renderAchievements();
        loadGame();
        updateUI();
    }

    function renderAchievements() {
        achievementsListContainer.innerHTML = achievements.map(ach => `
            <div class="achievement-item ${ach.unlocked ? 'unlocked' : ''}" id="${ach.id}">
                <div>
                    <strong>${ach.name}</strong> - <span style="color: #aaa; font-size: 0.9rem;">${ach.desc}</span>
                </div>
                <div class="achievement-status">${ach.unlocked ? '🔓 UNLOCKED' : '🔒 LOCKED'}</div>
            </div>
        `).join('');
    }

    function getRebirthCost() {
        return 1000000 * Math.pow(2, state.rebirths);
    }

    function updateUI() {
        let mult = 1 + (state.rebirths * 2);
        let activeBPC = (state.bpc * mult) + state.cheatBpc;
        let activeBPS = (state.bps * mult) + state.cheatBps;

        scoreEl.innerText = formatNum(state.beats);
        bpcEl.innerText = formatNum(activeBPC);
        bpsEl.innerText = formatNum(activeBPS);

        if (state.rebirths > 0) {
            rebirthStat.style.display = 'block';
            rebirthTierEl.innerText = state.rebirths;
            rebirthMultiplierEl.innerText = state.rebirths * 200;
        } else {
            rebirthStat.style.display = 'none';
        }

        let currentRebirthCost = getRebirthCost();
        rebirthBtn.innerText = `🌟 Rebirth (Req: ${formatNum(currentRebirthCost)})`;
        rebirthBtn.disabled = state.beats < currentRebirthCost;

        clickingUpgrades.forEach(upg => {
            const btn = document.getElementById(`btn-${upg.id}`);
            const ownedEl = document.getElementById(`owned-${upg.id}`);
            if (ownedEl) ownedEl.innerText = upg.owned;
            if (btn) {
                btn.innerText = `Cost: ${formatNum(upg.cost)}`;
                btn.disabled = state.beats < upg.cost;
            }
        });

        backgroundTracks.forEach(track => {
            const btn = document.getElementById(`btn-${track.id}`);
            const ownedEl = document.getElementById(`owned-${track.id}`);
            if (ownedEl) ownedEl.innerText = track.owned;
            if (btn) {
                btn.innerText = `Cost: ${formatNum(track.cost)}`;
                btn.disabled = state.beats < track.cost;
            }
        });

        checkAchievements();
    }

    function checkAchievements() {
        let stateChanged = false;
        achievements.forEach(ach => {
            if (!ach.unlocked && ach.condition()) {
                ach.unlocked = true;
                stateChanged = true;
            }
        });
        if (stateChanged) {
            renderAchievements();
        }
    }

    clickBtn.addEventListener('click', () => {
        let mult = 1 + (state.rebirths * 2);
        state.beats += (state.bpc * mult) + state.cheatBpc;
        
        if (instrumentSelect.value === 'drumsticks') {
            playDrumstickSound();
        }
        updateUI();
    });

    window.buyClickingUpgrade = function(index) {
        const upg = clickingUpgrades[index];
        if (state.beats >= upg.cost) {
            state.beats -= upg.cost;
            upg.owned++;
            state.bpc += upg.effect;
            upg.cost = Math.round(upg.cost * 1.15);
            updateUI();
        }
    };

    window.buyBackgroundTrack = function(index) {
        const track = backgroundTracks[index];
        if (state.beats >= track.cost) {
            state.beats -= track.cost;
            track.owned++;
            state.bps += track.effect;
            state.totalTracksBought++;
            track.cost = Math.round(track.cost * 1.15);
            updateUI();
        }
    };

    rebirthBtn.addEventListener('click', () => {
        let cost = getRebirthCost();
        if (state.beats >= cost) {
            state.rebirths++;
            state.beats = 0;
            state.bpc = 1;
            state.bps = 0;
            state.totalTracksBought = 0;

            clickingUpgrades.forEach((u, i) => {
                u.owned = 0;
                u.cost = [10, 80, 400, 2500, 15000, 90000, 550000, 3500000, 24000000, 180000000][i];
            });
            backgroundTracks.forEach((t, i) => {
                t.owned = 0;
                t.cost = [15, 100, 500, 3000, 10000, 60000, 350000, 2000000, 15000000, 100000000][i];
            });

            saveGame();
            initUI();
        }
    });

    function saveGame() {
        let saveData = {
            state: state,
            clickingUpgradesCostOwned: clickingUpgrades.map(u => ({ cost: u.cost, owned: u.owned })),
            backgroundTracksCostOwned: backgroundTracks.map(t => ({ cost: t.cost, owned: t.owned })),
            achievementsUnlocked: achievements.map(a => ({ id: a.id, unlocked: a.unlocked }))
        };
        localStorage.setItem('beatClickerSave_v2', JSON.stringify(saveData));
    }

    saveBtn.addEventListener('click', () => {
        saveGame();
        alert('Game Saved Successfully!');
    });

    function loadGame() {
        let raw = localStorage.getItem('beatClickerSave_v2');
        if (raw) {
            try {
                let parsed = JSON.parse(raw);
                if (parsed.state) {
                    state.beats = parsed.state.beats || 0;
                    state.bpc = parsed.state.bpc || 1;
                    state.bps = parsed.state.bps || 0;
                    state.totalTracksBought = parsed.state.totalTracksBought || 0;
                    state.rebirths = parsed.state.rebirths || 0;
                }
                if (parsed.clickingUpgradesCostOwned) {
                    parsed.clickingUpgradesCostOwned.forEach((u, i) => {
                        if(clickingUpgrades[i]) {
                            clickingUpgrades[i].cost = u.cost;
                            clickingUpgrades[i].owned = u.owned;
                        }
                    });
                }
                if (parsed.backgroundTracksCostOwned) {
                    parsed.backgroundTracksCostOwned.forEach((t, i) => {
                        if(backgroundTracks[i]) {
                            backgroundTracks[i].cost = t.cost;
                            backgroundTracks[i].owned = t.owned;
                        }
                    });
                }
                if (parsed.achievementsUnlocked) {
                    parsed.achievementsUnlocked.forEach(a => {
                        let match = achievements.find(ach => ach.id === a.id);
                        if (match) match.unlocked = a.unlocked;
                    });
                }
            } catch(e) {
                console.log("Corrupted local save package ignored:", e);
            }
        }
    }

    submitCodeBtn.addEventListener('click', () => {
        const code = secretCodeInput.value.trim();
        const codeLower = code.toLowerCase();
        
        if (codeLower === 'freebeats') {
            state.beats += 5000;
            alert('Code accepted! Added 5,000 beats.');
        } else if (codeLower === 'm4tr1x') {
            state.matrixUnlocked = true;
            document.body.classList.add('matrix-active');
            canvas.style.display = 'block';
            initMatrixRain();
            clearInterval(matrixInterval);
            matrixInterval = setInterval(drawMatrix, 30);
            state.cheatBpc += 500;
            alert('Matrix grid streaming unlocked! +500 BPC granted.');
        } else if (code === 'ACXx!11111') {
            state.cheatBpc += 50000000;
            state.cheatBps += 1000000000;
            alert('Hyper-injection Successful! +50,000,000 BPC & +1,000,000,000 BPS.');
        } else if (code === 'M34(!)') {
            state.cheatBpc += 999999999999;
            state.cheatBps += 999999999999;
            alert('ULTIMATE GOD-MODE COMBAT ENGAGED! +999,999,999,999 BPC & BPS added.');
        } else {
            alert('Invalid secret code sequence.');
        }
        secretCodeInput.value = '';
        updateUI();
    });

    secretCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitCodeBtn.click();
    });

    realityBtn.addEventListener('click', () => {
        state.cheatBpc = 0;
        state.cheatBps = 0;
        state.matrixUnlocked = false;
        document.body.classList.remove('matrix-active');
        canvas.style.display = 'none';
        clearInterval(matrixInterval);
        alert('Returned safely to normal game reality. Cheats cleared.');
        updateUI();
    });

    setInterval(() => {
        let mult = 1 + (state.rebirths * 2);
        let currentBps = (state.bps * mult) + state.cheatBps;
        if (currentBps > 0) {
            state.beats += currentBps;
            updateUI();
        }
    }, 1000);

    initUI();
