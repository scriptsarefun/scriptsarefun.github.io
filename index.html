<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Music Clicker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: none;
            background-color: rgba(18, 18, 18, 0.9);
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            z-index: 1;
        }

        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            margin-bottom: 10px;
        }

        .matrix-mode h1 {
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .stats-panel {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .matrix-mode .stats-panel, .matrix-mode .card, .matrix-mode .achievements-panel, .matrix-mode .secret-code-section {
            background-color: rgba(16, 28, 16, 0.75) !important;
            border: 1px solid #00ff00 !important;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .stat {
            font-size: 1.2rem;
            margin: 5px 0;
        }

        #score {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00f0ff;
            transition: color 0.3s;
        }

        .matrix-mode #score {
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .action-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background-color: #444;
        }

        #rebirthBtn {
            background: linear-gradient(45deg, #7f00ff, #ff007f);
            border: none;
        }
        #rebirthBtn:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        .click-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s, box-shadow 0.1s, background 0.3s;
            margin-bottom: 30px;
        }

        .matrix-mode .click-btn {
            background: linear-gradient(45deg, #00aa00, #00ff00);
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.4);
            color: #000;
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .section-title {
            color: #00f0ff;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-top: 30px;
            text-align: left;
            transition: color 0.3s;
        }
        .matrix-mode .section-title {
            color: #00ff00;
            border-bottom-color: #00aa00;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .card h4 {
            margin: 0 0 5px 0;
            color: #fff;
        }

        .card p {
            margin: 5px 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        .card button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .card button:hover:not(:disabled) {
            background-color: #ff007f;
            border-color: #ff007f;
        }
        .matrix-mode .card button:hover:not(:disabled) {
            background-color: #00ff00;
            border-color: #00ff00;
            color: #000;
        }

        .card button:disabled {
            background-color: #222;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        .achievements-panel {
            background-color: #1a1a2e;
            border: 1px solid #00f0ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .achievement-item {
            padding: 10px;
            border-radius: 6px;
            background-color: #111;
            border-left: 4px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achievement-item.unlocked {
            border-left-color: #00f0ff;
            background-color: #16222f;
        }
        .matrix-mode .achievement-item.unlocked {
            border-left-color: #00ff00;
            background-color: rgba(0, 50, 0, 0.4);
        }

        .achievement-status {
            font-weight: bold;
            font-size: 0.85rem;
            color: #555;
        }

        .achievement-item.unlocked .achievement-status {
            color: #00f0ff;
        }
        .matrix-mode .achievement-item.unlocked .achievement-status {
            color: #00ff00;
        }

        .instrument-select {
            background-color: #111;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            max-width: 250px;
            margin-bottom: 10px;
        }

        .secret-code-section {
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .secret-code-section input {
            background-color: #111;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            margin-right: 10px;
        }

        .secret-code-section button {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="container">
    <h1 id="gameTitle">🎵 Beat Clicker 🎵</h1>

    <div class="stats-panel">
        <div class="stat">Beats: <span id="score">0</span></div>
        <div class="stat">Beats Per Click (BPC): <span id="bpc">1</span></div>
        <div class="stat">Beats Per Second (BPS): <span id="bps">0</span></div>
        <div class="stat">Rebirth Tier: <span id="rebirthTier">0</span> (Multiplier: <span id="rebirthMult">1</span>x)</div>
    </div>

    <div class="action-row">
        <button class="action-btn" id="saveBtn">💾 Save Game</button>
        <button class="action-btn" id="rebirthBtn" disabled>🌟 Rebirth (Req: 1M)</button>
    </div>

    <button class="click-btn" id="clickBtn">DROP THE BEAT!</button>

    <div class="achievements-panel">
        <h3 style="margin-top: 0; color: #00f0ff; text-align: left;" id="achHeader">🏆 Achievements</h3>
        <div class="achievement-list" id="achievementsList"></div>
    </div>

    <h3 class="section-title">🎷 Instruments Section</h3>
    <div style="text-align: left; margin-bottom: 20px;">
        <select id="instrumentSelector" class="instrument-select">
            <option value="mute">Mute / Electronic Sync</option>
            <option value="drumsticks">Wooden Drumsticks</option>
        </select>
    </div>

    <h3 class="section-title">Buy & Unlock Clicking Upgrades</h3>
    <div class="grid" id="clickingUpgrades"></div>

    <h3 class="section-title">Buy & Unlock Background Tracks</h3>
    <div class="grid" id="backgroundTracks"></div>

    <div class="secret-code-section">
        <label for="secretCode">Enter Secret Code:</label><br><br>
        <input type="text" id="secretCode" placeholder="Code...">
        <button id="submitCode">Submit</button>
    </div>

    <div id="backToReality" class="back-link">⬅ Go Back to Reality</div>
</div>

<script>
    // Audio Context Generation (Web Audio API)
    let audioCtx = null;
    function playDrumstickSound() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Create nodes
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            // High pitch decay curve for sharp wooden impact
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {
            console.error("Audio Synthesis error: ", e);
        }
    }

    // Base Configurations (Legitimate values cached)
    const initialClickingUpgrades = [
        { id: 'bpc_1', name: 'Heavy Drumsticks', effect: 1, cost: 10, owned: 0 },
        { id: 'bpc_2', name: 'Amplified Mouse', effect: 5, cost: 80, owned: 0 },
        { id: 'bpc_3', name: 'Macro Beat Generator', effect: 20, cost: 400, owned: 0 },
        { id: 'bpc_4', name: 'Quantum Tap Engine', effect: 100, cost: 2500, owned: 0 },
        { id: 'bpc_5', name: 'Singularity Clicker', effect: 500, cost: 15000, owned: 0 },
        { id: 'bpc_6', name: 'Cosmic Tap Catalyst', effect: 2500, cost: 90000, owned: 0 },
        { id: 'bpc_7', name: 'Dimensional Rhythm Warp', effect: 10000, cost: 550000, owned: 0 },
        { id: 'bpc_8', name: 'Chrono Beat Fracturer', effect: 50000, cost: 3500000, owned: 0 },
        { id: 'bpc_9', name: 'Dark Matter Pulsator', effect: 250000, cost: 24000000, owned: 0 },
        { id: 'bpc_10', name: 'Infinity Drum', effect: 1000000, cost: 180000000, owned: 0 }
    ];

    const initialBackgroundTracks = [
        { id: 'bps_1', name: 'Upbeat Synth Theme', effect: 1, cost: 15, owned: 0 },
        { id: 'bps_2', name: 'Acoustic Funk Groove', effect: 5, cost: 100, owned: 0 },
        { id: 'bps_3', name: 'Club Techno Pulse', effect: 25, cost: 500, owned: 0 },
        { id: 'bps_4', name: 'Fast Breakbeat Energy', effect: 100, cost: 3000, owned: 0 },
        { id: 'bps_5', name: 'Cyber Arpeggio Overdrive', effect: 500, cost: 10000, owned: 0 },
        { id: 'bps_6', name: 'Hypersonic Remix', effect: 2500, cost: 60000, owned: 0 },
        { id: 'bps_7', name: 'Galactic Symphony', effect: 10000, cost: 350000, owned: 0 },
        { id: 'bps_8', name: 'Time-Warp Continuum', effect: 50000, cost: 2000000, owned: 0 },
        { id: 'bps_9', name: 'Multiverse Bassline', effect: 250000, cost: 15000000, owned: 0 },
        { id: 'bps_10', name: 'Omniverse Masterpiece', effect: 1000000, cost: 100000000, owned: 0 },
        { id: 'bps_11', name: 'Astral Harmony', effect: 5000000, cost: 750000000, owned: 0 },
        { id: 'bps_12', name: 'Supernova Baseline', effect: 25000000, cost: 4000000000, owned: 0 },
        { id: 'bps_13', name: 'Infinity Symphony', effect: 100000000, cost: 25000000000, owned: 0 },
        { id: 'bps_14', name: 'Reality Tear Remix', effect: 500000000, cost: 150000000000, owned: 0 },
        { id: 'bps_15', name: 'Cosmic Overlord Anthem', effect: 2500000000, cost: 1000000000000 }
    ];

    // Core Game State
    let state = {
        beats: 0,
        rebirths: 0,
        totalTracksBought: 0,
        unlockedAchievements: []
    };

    // Runtime Cheat Buffs (re-calculated on top of state base progress)
    let cheats = {
        matrixActive: false,
        bonusBPC: 0,
        bonusBPS: 0
    };

    let clickingUpgrades = JSON.parse(JSON.stringify(initialClickingUpgrades));
    let backgroundTracks = JSON.parse(JSON.stringify(initialBackgroundTracks));

    const achievements = [
        { id: 'ach_1', name: 'First Beat', desc: 'Reach 1 total beat', condition: () => state.beats >= 1 },
        { id: 'ach_2', name: 'Getting Groovy', desc: 'Reach 100 total beats', condition: () => state.beats >= 100 },
        { id: 'ach_3', name: 'Studio Producer', desc: 'Reach 10,000 total beats', condition: () => state.beats >= 10000 },
        { id: 'ach_4', name: 'Beat Master', desc: 'Purchase your first background track', condition: () => state.totalTracksBought >= 1 },
        { id: 'ach_5', name: 'Click Elite', desc: 'Reach 50 Beats Per Click (BPC)', condition: () => getCalculatedBPC() >= 50 }
    ];

    // DOM References
    const scoreEl = document.getElementById('score');
    const bpcEl = document.getElementById('bpc');
    const bpsEl = document.getElementById('bps');
    const rebirthTierEl = document.getElementById('rebirthTier');
    const rebirthMultEl = document.getElementById('rebirthMult');
    const clickBtn = document.getElementById('clickBtn');
    const rebirthBtn = document.getElementById('rebirthBtn');
    const saveBtn = document.getElementById('saveBtn');
    const clickingUpgradesContainer = document.getElementById('clickingUpgrades');
    const backgroundTracksContainer = document.getElementById('backgroundTracks');
    const achievementsListContainer = document.getElementById('achievementsList');
    const secretCodeInput = document.getElementById('secretCode');
    const submitCodeBtn = document.getElementById('submitCode');
    const backToRealityBtn = document.getElementById('backToReality');
    const instrumentSelector = document.getElementById('instrumentSelector');
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    // Formula Helpers
    function getRebirthMultiplier() {
        return 1 + (state.rebirths * 2); // Base 1x + 2x per rebirth (reaches 3x, 5x, 7x...)
    }

    function getRebirthRequirement() {
        return 1000000 * Math.pow(5, state.rebirths);
    }

    function getCalculatedBPC() {
        let baseBPC = 1;
        clickingUpgrades.forEach(u => baseBPC += (u.owned * u.effect));
        return (baseBPC * getRebirthMultiplier()) + cheats.bonusBPC;
    }

    function getCalculatedBPS() {
        let baseBPS = 0;
        backgroundTracks.forEach(t => baseBPS += (t.owned * t.effect));
        return (baseBPS * getRebirthMultiplier()) + cheats.bonusBPS;
    }

    function formatNum(num) {
        return num.toLocaleString();
    }

    // UI Assembly
    function initUI() {
        clickingUpgradesContainer.innerHTML = clickingUpgrades.map((upg, idx) => `
            <div class="card" id="card-${upg.id}">
                <div>
                    <h4>${upg.name}</h4>
                    <p>Gives +${formatNum(upg.effect)} Base BPC</p>
                    <p>Owned: <span id="owned-${upg.id}">0</span></p>
                </div>
                <button id="btn-${upg.id}" onclick="buyClickingUpgrade(${idx})">Cost: ${formatNum(upg.cost)}</button>
            </div>
        `).join('');

        backgroundTracksContainer.innerHTML = backgroundTracks.map((track, idx) => `
            <div class="card" id="card-${track.id}">
                <div>
                    <h4>${track.name}</h4>
                    <p>Gives +${formatNum(track.effect)} Base BPS</p>
                    <p>Owned: <span id="owned-${track.id}">0</span></p>
                </div>
                <button id="btn-${track.id}" onclick="buyBackgroundTrack(${idx})">Cost: ${formatNum(track.cost)}</button>
            </div>
        `).join('');

        renderAchievements();
        loadGame();
        updateUI();
    }

    function renderAchievements() {
        achievementsListContainer.innerHTML = achievements.map(ach => {
            const isUnlocked = state.unlockedAchievements.includes(ach.id);
            return `
                <div class="achievement-item ${isUnlocked ? 'unlocked' : ''}" id="${ach.id}">
                    <div>
                        <strong>${ach.name}</strong> - <span style="color: #aaa; font-size: 0.9rem;">${ach.desc}</span>
                    </div>
                    <div class="achievement-status">${isUnlocked ? '🔓 UNLOCKED' : '🔒 LOCKED'}</div>
                </div>
            `;
        }).join('');
    }

    function updateUI() {
        const currentBPC = getCalculatedBPC();
        const currentBPS = getCalculatedBPS();
        const rebReq = getRebirthRequirement();

        scoreEl.innerText = formatNum(state.beats);
        bpcEl.innerText = formatNum(currentBPC);
        bpsEl.innerText = formatNum(currentBPS);
        rebirthTierEl.innerText = state.rebirths;
        rebirthMultEl.innerText = getRebirthMultiplier();

        rebirthBtn.innerText = `🌟 Rebirth (Req: ${formatNum(rebReq)})`;
        rebirthBtn.disabled = state.beats < rebReq;

        clickingUpgrades.forEach(upg => {
            const btn = document.getElementById(`btn-${upg.id}`);
            const ownedEl = document.getElementById(`owned-${upg.id}`);
            if (ownedEl) ownedEl.innerText = upg.owned;
            if (btn) {
                btn.innerText = `Cost: ${formatNum(upg.cost)}`;
                btn.disabled = state.beats < upg.cost;
            }
        });

        backgroundTracks.forEach(track => {
            const btn = document.getElementById(`btn-${track.id}`);
            const ownedEl = document.getElementById(`owned-${track.id}`);
            if (ownedEl) ownedEl.innerText = track.owned;
            if (btn) {
                btn.innerText = `Cost: ${formatNum(track.cost)}`;
                btn.disabled = state.beats < track.cost;
            }
        });

        checkAchievements();
    }

    function checkAchievements() {
        let stateChanged = false;
        achievements.forEach(ach => {
            if (!state.unlockedAchievements.includes(ach.id) && ach.condition()) {
                state.unlockedAchievements.push(ach.id);
                stateChanged = true;
            }
        });
        if (stateChanged) {
            renderAchievements();
        }
    }

    // Loop Operations
    clickBtn.addEventListener('click', () => {
        if (instrumentSelector.value === 'drumsticks') {
            playDrumstickSound();
        }
        state.beats += getCalculatedBPC();
        updateUI();
    });

    window.buyClickingUpgrade = function(index) {
        const upg = clickingUpgrades[index];
        if (state.beats >= upg.cost) {
            state.beats -= upg.cost;
            upg.owned++;
            upg.cost = Math.round(upg.cost * 1.15);
            updateUI();
        }
    };

    window.buyBackgroundTrack = function(index) {
        const track = backgroundTracks[index];
        if (state.beats >= track.cost) {
            state.beats -= track.cost;
            track.owned++;
            state.totalTracksBought++;
            track.cost = Math.round(track.cost * 1.15);
            updateUI();
        }
    };

    // Rebirth Operation Matrix
    rebirthBtn.addEventListener('click', () => {
        const req = getRebirthRequirement();
        if (state.beats >= req) {
            state.beats = 0;
            state.rebirths++;
            state.totalTracksBought = 0;
            clickingUpgrades = JSON.parse(JSON.stringify(initialClickingUpgrades));
            backgroundTracks = JSON.parse(JSON.stringify(initialBackgroundTracks));
            updateUI();
            alert(`Congratulations! You reached Rebirth Tier ${state.rebirths}. Your production power has increased.`);
        }
    });

    // Save & Load Core Operations
    saveBtn.addEventListener('click', () => {
        const dataToSave = {
            state: state,
            clickingUpgrades: clickingUpgrades,
            backgroundTracks: backgroundTracks
        };
        localStorage.setItem('musicClicker_saveData', JSON.stringify(dataToSave));
        alert('Game progress saved securely!');
    });

    function loadGame() {
        const rawData = localStorage.getItem('musicClicker_saveData');
        if (rawData) {
            try {
                const parsed = JSON.parse(rawData);
                if (parsed.state) state = { ...state, ...parsed.state };
                if (parsed.clickingUpgrades) clickingUpgrades = parsed.clickingUpgrades;
                if (parsed.backgroundTracks) backgroundTracks = parsed.backgroundTracks;
            } catch(e) {
                console.error("Failed loading saved data", e);
            }
        }
    }

    // Secret Input Matrix Systems
    submitCodeBtn.addEventListener('click', () => {
        const code = secretCodeInput.value.trim();
        const lowerCode = code.toLowerCase();
        
        if (lowerCode === 'freebeats') {
            state.beats += 5000;
            alert('Code accepted! Added 5,000 beats.');
        } else if (lowerCode === 'm4tr1x') {
            cheats.matrixActive = true;
            cheats.bonusBPC += 500;
            document.body.classList.add('matrix-mode');
            canvas.style.display = 'block';
            resizeCanvas();
            alert('Matrix grid overrides accepted. Visual streaming initialized +500 BPC.');
        } else if (code === 'ACXx!11111') {
            cheats.bonusBPC += 50000000;
            cheats.bonusBPS += 1000000000;
            alert('God mode sequence injected! +50M BPC and +1B BPS.');
        } else if (code === 'M34(!)') {
            cheats.bonusBPC += 999999999999;
            cheats.bonusBPS += 999999999999;
            alert('Ultimate Reality Tear Activated! +999,999,999,999 BPC & BPS.');
        } else {
            alert('Invalid encryption entry code.');
        }
        secretCodeInput.value = '';
        updateUI();
    });

    secretCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitCodeBtn.click();
    });

    // Reality Reset Engine
    backToRealityBtn.addEventListener('click', () => {
        cheats.matrixActive = false;
        cheats.bonusBPC = 0;
        cheats.bonusBPS = 0;
        document.body.classList.remove('matrix-mode');
        canvas.style.display = 'none';
        updateUI();
        alert('Visual anomalies terminated. Alternate cheat parameters cleared. Legitimate progress sustained.');
    });

    // Matrix Rain Visual Canvas Backdrop Rendering logic
    let columns = [];
    const fontSize = 16;
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const numCols = Math.floor(canvas.width / fontSize);
        columns = [];
        for (let i = 0; i < numCols; i++) {
            columns.push(Math.random() * -100);
        }
    }
    window.addEventListener('resize', () => {
        if(cheats.matrixActive) resizeCanvas();
    });

    function drawMatrixRain() {
        if (!cheats.matrixActive) {
            requestAnimationFrame(drawMatrixRain);
            return;
        }
        ctx.fillStyle = 'rgba(18, 18, 18, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00ff00';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < columns.length; i++) {
            const char = String.fromCharCode(33 + Math.floor(Math.random() * 93));
            const x = i * fontSize;
            const y = columns[i] * fontSize;

            ctx.fillText(char, x, y);

            if (y > canvas.height && Math.random() > 0.975) {
                columns[i] = 0;
            }
            columns[i]++;
        }
        requestAnimationFrame(drawMatrixRain);
    }
    requestAnimationFrame(drawMatrixRain);

    // Idle Production Clock loop execution interval
    setInterval(() => {
        const currentBPS = getCalculatedBPS();
        if (currentBPS > 0) {
            state.beats += (currentBPS / 10);
            updateUI();
        }
    }, 100);

    initUI();
</script>
</body>
</html>
