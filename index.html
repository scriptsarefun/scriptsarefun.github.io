<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Synth Clicker</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #ffffff;
            --accent-color: #e94560;
            --panel-bg: #16213e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease;
        }

        body.matrix-mode {
            --bg-color: #000000;
            --text-color: #00ff00;
            --accent-color: #008f11;
            --panel-bg: #0d1f0d;
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .volume-panel {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .score-display {
            font-size: 2.5rem;
            margin: 20px 0;
            font-weight: bold;
        }

        .click-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .matrix-mode .click-btn {
            color: #00ff00;
            border: 2px solid #00ff00;
            background: transparent;
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .upgrade-item:last-child {
            border-bottom: none;
        }

        .buy-btn {
            background-color: #0f3460;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .matrix-mode .buy-btn {
            border: 1px solid #00ff00;
            background: transparent;
            color: #00ff00;
        }

        .buy-btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .secret-input {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
        }

        .back-btn {
            display: none;
            margin-top: 20px;
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="game-title">🎵 Beat Clicker 🎵</h1>
        
        <div class="volume-panel">
            <span>🔊 Volume:</span>
            <input type="range" id="volume-control" class="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="adjustVolume(this.value)">
            <span id="volume-label">50%</span>
        </div>

        <div class="score-display">Beats: <span id="score">0</span></div>
        <div style="margin-bottom: 10px;">Beats Per Second (BPS): <span id="bps">0</span></div>
        
        <button class="click-btn" id="click-trigger" onclick="clickBeats()">DROP THE BEAT!</button>

        <div class="panel">
            <h3>Buy & Activate Synth Generators</h3>
            <div id="upgrades-container"></div>
        </div>

        <div id="secret-section">
            <p>Enter Secret Code:</p>
            <input type="password" id="matrix-code" class="secret-input" placeholder="???" oninput="checkCode()">
        </div>

        <button id="back-button" class="back-btn" onclick="exitMatrixMode()">⬅ Go Back to Reality</button>
    </div>

    <script>
        let score = 0;
        let beatsPerSecond = 0;
        let globalVolume = 0.5;

        // Native Audio Synthesis Engine (Bypasses URLs completely)
        let audioCtx = null;
        let mainGainNode = null;
        let musicInterval = null;
        let currentSequence = 0;

        const upgrades = [
            { id: 1, name: "Sub-Bass Hum Generator", cost: 15, bps: 1, count: 0, notes: [110, 130, 110, 146] },
            { id: 2, name: "Retro Chiptune Arpeggiator", cost: 100, bps: 5, count: 0, notes: [220, 261, 329, 392] },
            { id: 3, name: "Industrial Techno Pulse", cost: 500, bps: 25, count: 0, notes: [164, 196, 220, 293] },
            { id: 4, name: "Cyber Rave Oscillator", cost: 3000, bps: 100, count: 0, notes: [440, 523, 659, 783] },
            { id: 5, name: "Hyperdrive Melody Core", cost: 10000, bps: 500, count: 0, notes: [587, 698, 880, 1046] }
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mainGainNode = audioCtx.createGain();
                mainGainNode.gain.setValueAtTime(globalVolume, audioCtx.currentTime);
                mainGainNode.connect(audioCtx.destination);
                startSequencer();
            }
        }

        function startSequencer() {
            let step = 0;
            musicInterval = setInterval(() => {
                let highestUnlocked = -1;
                upgrades.forEach((up, idx) => {
                    if (up.count > 0) highestUnlocked = idx;
                });

                if (document.body.classList.contains('matrix-mode')) {
                    playSynthTone(587 * ((step % 4) + 1), 0.15, 'sawtooth');
                } else if (highestUnlocked !== -1) {
                    let track = upgrades[highestUnlocked];
                    let currentNote = track.notes[step % track.notes.length];
                    playSynthTone(currentNote, 0.25, 'triangle');
                }
                step++;
            }, 250);
        }

        function playSynthTone(frequency, duration, type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gainNode);
                gainNode.connect(mainGainNode);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function initGame() {
            const container = document.getElementById('upgrades-container');
            container.innerHTML = '';
            
            upgrades.forEach(up => {
                container.innerHTML += `
                    <div class="upgrade-item" id="item-${up.id}">
                        <div>
                            <strong>${up.name}</strong><br>
                            <small>Gives +${up.bps} BPS | Owned: <span id="count-${up.id}">0</span></small>
                        </div>
                        <button class="buy-btn" id="btn-${up.id}" onclick="buyUpgrade(${up.id})">
                            Cost: ${up.cost}
                        </button>
                    </div>
                `;
            });
            updateUI();
        }

        function clickBeats() {
            initAudio();
            // User click interaction feedback sound
            playSynthTone(440, 0.05, 'sine');
            const multiplier = document.body.classList.contains('matrix-mode') ? 10 : 1;
            score += multiplier;
            updateUI();
        }

        function buyUpgrade(id) {
            initAudio();
            const upgrade = upgrades.find(up => up.id === id);
            if (score >= upgrade.cost) {
                score -= upgrade.cost;
                upgrade.count++;
                upgrade.cost = Math.floor(upgrade.cost * 1.15);
                calculateBPS();
                playSynthTone(880, 0.15, 'sine');
                updateUI();
            }
        }

        function adjustVolume(val) {
            globalVolume = parseFloat(val);
            document.getElementById('volume-label').innerText = Math.round(globalVolume * 100) + "%";
            if (mainGainNode && audioCtx) {
                mainGainNode.gain.setValueAtTime(globalVolume, audioCtx.currentTime);
            }
        }

        function calculateBPS() {
            beatsPerSecond = upgrades.reduce((total, up) => total + (up.count * up.bps), 0);
        }

        function updateUI() {
            document.getElementById('score').innerText = Math.floor(score);
            document.getElementById('bps').innerText = beatsPerSecond;
