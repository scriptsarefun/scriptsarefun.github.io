<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Music Clicker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: none;
            background-color: rgba(18, 18, 18, 0.95);
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            margin-bottom: 5px;
        }

        .rebirth-display {
            font-size: 1.1rem;
            color: #ffaa00;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .stats-panel {
            background-color: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        .matrix-mode .stats-panel, 
        .matrix-mode .card, 
        .matrix-mode .achievements-panel,
        .matrix-mode .control-panel {
            background-color: rgba(15, 25, 15, 0.85) !important;
            border: 1px solid #00ff00 !important;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2) !important;
        }

        .matrix-mode h1, .matrix-mode .section-title, .matrix-mode h3 {
            color: #00ff00 !important;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.6) !important;
        }

        .matrix-mode .click-btn {
            background: linear-gradient(45deg, #00ff00, #005500) !important;
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.4) !important;
        }

        .stat {
            font-size: 1.2rem;
            margin: 5px 0;
        }

        #score {
            font-size: 2.8rem;
            font-weight: bold;
            color: #00f0ff;
        }
        .matrix-mode #score { color: #00ff00 !important; }

        .click-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 25px;
        }

        .click-btn:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(255, 0, 127, 0.4);
        }

        .control-panel {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #333;
        }

        .control-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .control-btn:hover:not(:disabled) {
            background-color: #00f0ff;
            color: black;
            border-color: #00f0ff;
        }
        .control-btn:disabled {
            background-color: #222;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        select {
            background-color: #111;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .section-title {
            color: #00f0ff;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-top: 35px;
            text-align: left;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }

        .card h4 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 1.1rem;
        }

        .card p {
            margin: 5px 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        .card button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
            transition: background-color 0.2s;
        }

        .card button:hover:not(:disabled) {
            background-color: #ff007f;
            border-color: #ff007f;
        }
        .matrix-mode .card button:hover:not(:disabled) {
            background-color: #00ff00;
            color: black;
            border-color: #00ff00;
        }

        .card button:disabled {
            background-color: #222;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        .achievements-panel {
            background-color: #1a1a2e;
            border: 1px solid #00f0ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            width: 100%;
            box-sizing: border-box;
        }

        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .achievement-item {
            padding: 10px;
            border-radius: 6px;
            background-color: #111;
            border-left: 4px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achievement-item.unlocked {
            border-left-color: #00f0ff;
            background-color: #16222f;
        }

        .achievement-status {
            font-weight: bold;
            font-size: 0.85rem;
            color: #555;
        }

        .achievement-item.unlocked .achievement-status {
            color: #00f0ff;
        }
        .matrix-mode .achievement-item.unlocked {
            border-left-color: #00ff00;
            background-color: #0a150a;
        }
        .matrix-mode .achievement-item.unlocked .achievement-status {
            color: #00ff00;
        }

        .secret-code-section {
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 20px;
            background-color: rgba(30, 30, 30, 0.85);
            border-radius: 8px;
            border: 1px solid #333;
        }

        .secret-code-section input {
            background-color: #111;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-right: 10px;
            width: 200px;
        }

        .secret-code-section button {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .secret-code-section button:hover {
            background-color: #555;
        }

        .back-link {
            color: #ff3b3b;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 40px;
            border: 1px solid #ff3b3b;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .back-link:hover {
            background-color: #ff3b3b;
            color: white;
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.5);
        }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="container" id="gameContainer">
    <h1>🎵 Ultimate Music Clicker 🎵</h1>
    <div class="rebirth-display" id="rebirthDisplay">Rebirth Tier: 0 (Multiplier: +0% Global Production)</div>

    <div class="stats-panel">
        <div class="stat">Beats: <span id="score">0</span></div>
        <div class="stat">Beats Per Click (BPC): <span id="bpc">1</span></div>
        <div class="stat">Beats Per Second (BPS): <span id="bps">0</span></div>
    </div>

    <button class="click-btn" id="clickBtn">DROP THE BEAT!</button>

    <div class="control-panel">
        <button class="control-btn" id="saveBtn">💾 Save Game</button>
        <button class="control-btn" id="rebirthBtn" disabled>🌟 Rebirth (Requires 1M Beats)</button>
        <div>
            <label for="instrumentSelect" style="font-weight:bold; margin-right:5px;">🎷 Instruments:</label>
            <select id="instrumentSelect">
                <option value="mute">Mute / Electronic Sync</option>
                <option value="drumsticks">Wooden Drumsticks</option>
            </select>
        </div>
    </div>

    <div class="achievements-panel">
        <h3 style="margin-top: 0; color: #00f0ff; text-align: left;">🏆 Achievements</h3>
        <div class="achievement-list" id="achievementsList"></div>
    </div>

    <h3 class="section-title">Buy & Unlock Clicking Upgrades</h3>
    <div class="grid" id="clickingUpgrades"></div>

    <h3 class="section-title">Buy & Unlock Background Tracks</h3>
    <div class="grid" id="backgroundTracks"></div>

    <div class="secret-code-section">
        <label for="secretCode" style="font-weight:bold;">Enter Secret Code:</label><br><br>
        <input type="text" id="secretCode" placeholder="Code...">
        <button id="submitCode">Submit</button>
    </div>

    <div class="back-link" id="realityBtn">⬅ Go Back to Reality</div>
</div>

<script>
    // Audio Context Setup
    let audioCtx = null;
    function playDrumstickSound() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // High frequency click node
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        } catch(e) {
            console.error("Audio error: ", e);
        }
    }

    // Game Core State
    let state = {
        beats: 0,
        bpc: 1,
        bps: 0,
        rebirths: 0,
        totalTracksBought: 0
    };

    // Active Cheat modifiers separate from base game logic
    let cheats = {
        active: false,
        matrixRain: false,
        bpc_inject: 0,
        bps_inject: 0
    };

    // Upgrades Config - Enhanced list up to tier 15
    const clickingUpgrades = [
        { id: 'bpc_1', name: 'Heavy Drumsticks', effect: 1, cost: 10, owned: 0 },
        { id: 'bpc_2', name: 'Amplified Mouse', effect: 5, cost: 80, owned: 0 },
        { id: 'bpc_3', name: 'Macro Beat Generator', effect: 20, cost: 400, owned: 0 },
        { id: 'bpc_4', name: 'Quantum Tap Engine', effect: 100, cost: 2500, owned: 0 },
        { id: 'bpc_5', name: 'Singularity Clicker', effect: 500, cost: 15000, owned: 0 },
        { id: 'bpc_6', name: 'Cosmic Tap Catalyst', effect: 2500, cost: 90000, owned: 0 },
        { id: 'bpc_7', name: 'Dimensional Rhythm Warp', effect: 10000, cost: 550000, owned: 0 },
        { id: 'bpc_8', name: 'Chrono Beat Fracturer', effect: 50000, cost: 3500000, owned: 0 },
        { id: 'bpc_9', name: 'Dark Matter Pulsator', effect: 250000, cost: 24000000, owned: 0 },
        { id: 'bpc_10', name: 'Infinity Drum', effect: 1000000, cost: 180000000, owned: 0 },
        { id: 'bpc_11', name: 'Supernova Strike Plectrum', effect: 5000000, cost: 1500000000, owned: 0 },
        { id: 'bpc_12', name: 'Hyper-Dimensional Gong', effect: 25000000, cost: 12000000000, owned: 0 },
        { id: 'bpc_13', name: 'Timeless Pulse Injector', effect: 150000000, cost: 95000000000, owned: 0 },
        { id: 'bpc_14', name: 'Cosmic Strings Plucker', effect: 1000000000, cost: 800000000000, owned: 0 },
        { id: 'bpc_15', name: 'Multiverse Singularity Tap', effect: 10000000000, cost: 7500000000000, owned: 0 }
    ];

    const backgroundTracks = [
        { id: 'bps_1', name: 'Upbeat Synth Theme', effect: 1, cost: 15, owned: 0 },
        { id: 'bps_2', name: 'Acoustic Funk Groove', effect: 5, cost: 100, owned: 0 },
        { id: 'bps_3', name: 'Club Techno Pulse', effect: 25, cost: 500, owned: 0 },
        { id: 'bps_4', name: 'Fast Breakbeat Energy', effect: 100, cost: 3000, owned: 0 },
        { id: 'bps_5', name: 'Cyber Arpeggio Overdrive', effect: 500, cost: 10000, owned: 0 },
        { id: 'bps_6', name: 'Hypersonic Remix', effect: 2500, cost: 60000, owned: 0 },
        { id: 'bps_7', name: 'Galactic Symphony', effect: 10000, cost: 350000, owned: 0 },
        { id: 'bps_8', name: 'Time-Warp Continuum', effect: 50000, cost: 2000000, owned: 0 },
        { id: 'bps_9', name: 'Multiverse Bassline', effect: 250000, cost: 15000000, owned: 0 },
        { id: 'bps_10', name: 'Omniverse Masterpiece', effect: 1000000, cost: 100000000, owned: 0 },
        { id: 'bps_11', name: 'Astral Harmony', effect: 5000000, cost: 750000000, owned: 0 },
        { id: 'bps_12', name: 'Supernova Baseline', effect: 25000000, cost: 4000000000, owned: 0 },
        { id: 'bps_13', name: 'Infinity Symphony', effect: 100000000, cost: 25000000000, owned: 0 },
        { id: 'bps_14', name: 'Reality Tear Remix', effect: 500000000, cost: 150000000000, owned: 0 },
        { id: 'bps_15', name: 'Cosmic Overlord Anthem', effect: 2500000000, cost: 1000000000000, owned: 0 },
        { id: 'bps_16', name: 'Chrono-Fractal Metronome', effect: 15000000000, cost: 8500000000000, owned: 0 },
        { id: 'bps_17', name: 'Quantum Void Sub-Woofer', effect: 100000000000, cost: 70000000000000, owned: 0 },
        { id: 'bps_18', name: 'Eternity Resonance Core', effect: 750000000000, cost: 600000000000000, owned: 0 }
    ];

    const achievements = [
        { id: 'ach_1', name: 'First Beat', desc: 'Reach 1 total beat', unlocked: false, condition: () => state.beats >= 1 },
        { id: 'ach_2', name: 'Getting Groovy', desc: 'Reach 100 total beats', unlocked: false, condition: () => state.beats >= 100 },
        { id: 'ach_3', name: 'Studio Producer', desc: 'Reach 10,000 total beats', unlocked: false, condition: () => state.beats >= 10000 },
        { id: 'ach_4', name: 'Beat Master', desc: 'Purchase your first background track', unlocked: false, condition: () => state.totalTracksBought >= 1 },
        { id: 'ach_5', name: 'Click Elite', desc: 'Reach 50 Beats Per Click (BPC)', unlocked: false, condition: () => computeBaseBPC() >= 50 }
    ];

    // DOM Links
    const scoreEl = document.getElementById('score');
    const bpcEl = document.getElementById('bpc');
    const bpsEl = document.getElementById('bps');
    const clickBtn = document.getElementById('clickBtn');
    const rebirthDisplayEl = document.getElementById('rebirthDisplay');
    const rebirthBtn = document.getElementById('rebirthBtn');
    const saveBtn = document.getElementById('saveBtn');
    const instrumentSelect = document.getElementById('instrumentSelect');
    const clickingUpgradesContainer = document.getElementById('clickingUpgrades');
    const backgroundTracksContainer = document.getElementById('backgroundTracks');
    const achievementsListContainer = document.getElementById('achievementsList');
    const secretCodeInput = document.getElementById('secretCode');
    const submitCodeBtn = document.getElementById('submitCode');
    const realityBtn = document.getElementById('realityBtn');
    const gameContainer = document.getElementById('gameContainer');

    function formatNum(num) {
        return num.toLocaleString();
    }

    function computeBaseBPC() {
        let base = 1;
        clickingUpgrades.forEach(u => base += u.owned * u.effect);
        return base;
    }

    function computeBaseBPS() {
        let base = 0;
        backgroundTracks.forEach(t => base += t.owned * t.effect);
        return base;
    }

    function getRebirthCost() {
        return 1000000 * Math.pow(5, state.rebirths);
    }

    function getMultiplier() {
        return 1 + (state.rebirths * 2); // Each rebirth layer yields +200% base
    }

    function initUI() {
        clickingUpgradesContainer.innerHTML = clickingUpgrades.map((upg, idx) => `
            <div class="card" id="card-${upg.id}">
                <div>
                    <h4>${upg.name}</h4>
                    <p>Gives +${formatNum(upg.effect)} BPC</p>
                    <p>Owned: <span id="owned-${upg.id}">0</span></p>
                </div>
                <button id="btn-${upg.id}" onclick="buyClickingUpgrade(${idx})">Cost: ${formatNum(upg.cost)}</button>
            </div>
        `).join('');

        backgroundTracksContainer.innerHTML = backgroundTracks.map((track, idx) => `
            <div class="card" id="card-${track.id}">
                <div>
                    <h4>${track.name}</h4>
                    <p>Gives +${formatNum(track.effect)} BPS</p>
                    <p>Owned: <span id="owned-${track.id}">0</span></p>
                </div>
                <button id="btn-${track.id}" onclick="buyBackgroundTrack(${idx})">Cost: ${formatNum(track.cost)}</button>
            </div>
        `).join('');

        renderAchievements();
        loadGame();
        updateUI();
    }

    function renderAchievements() {
        achievementsListContainer.innerHTML = achievements.map(ach => `
            <div class="achievement-item ${ach.unlocked ? 'unlocked' : ''}" id="${ach.id}">
                <div>
                    <strong>${ach.name}</strong> - <span style="color: #aaa; font-size: 0.9rem;">${ach.desc}</span>
                </div>
                <div class="achievement-status">${ach.unlocked ? '🔓 UNLOCKED' : '🔒 LOCKED'}</div>
            </div>
        `).join('');
    }

    function updateUI() {
        let mult = getMultiplier();
        let currentBPC = (computeBaseBPC() * mult) + cheats.bpc_inject;
        let currentBPS = (computeBaseBPS() * mult) + cheats.bps_inject;

        scoreEl.innerText = formatNum(state.beats);
        bpcEl.innerText = formatNum(currentBPC);
        bpsEl.innerText = formatNum(currentBPS);

        rebirthDisplayEl.innerText = `Rebirth Tier: ${state.rebirths} (Multiplier: +${state.rebirths * 200}% Global Production)`;

        let rCost = getRebirthCost();
        rebirthBtn.innerText = `🌟 Rebirth (Requires ${formatNum(rCost)} Beats)`;
        rebirthBtn.disabled = state.beats < rCost;

        clickingUpgrades.forEach(upg => {
            const btn = document.getElementById(`btn-${upg.id}`);
            const ownedEl = document.getElementById(`owned-${upg.id}`);
            if(ownedEl) ownedEl.innerText = upg.owned;
            if(btn) {
                btn.innerText = `Cost: ${formatNum(upg.cost)}`;
                btn.disabled = state.beats < upg.cost;
            }
        });

        backgroundTracks.forEach(track => {
            const btn = document.getElementById(`btn-${track.id}`);
            const ownedEl = document.getElementById(`owned-${track.id}`);
            if(ownedEl) ownedEl.innerText = track.owned;
            if(btn) {
                btn.innerText = `Cost: ${formatNum(track.cost)}`;
                btn.disabled = state.beats < track.cost;
            }
        });

        checkAchievements();
    }

    function checkAchievements() {
        let changed = false;
        achievements.forEach(ach => {
            if (!ach.unlocked && ach.condition()) {
                ach.unlocked = true;
                changed = true;
            }
        });
        if (changed) {
            renderAchievements();
        }
    }

    // Input handlers
    clickBtn.addEventListener('click', () => {
        let mult = getMultiplier();
        let clickVal = (computeBaseBPC() * mult) + cheats.bpc_inject;
        state.beats += clickVal;

        if (instrumentSelect.value === 'drumsticks') {
            playDrumstickSound();
        }
        updateUI();
    });

    window.buyClickingUpgrade = function(index) {
        const upg = clickingUpgrades[index];
        if (state.beats >= upg.cost) {
            state.beats -= upg.cost;
            upg.owned++;
            upg.cost = Math.round(upg.cost * 1.15);
            updateUI();
        }
    };

    window.buyBackgroundTrack = function(index) {
        const track = backgroundTracks[index];
        if (state.beats >= track.cost) {
            state.beats -= track.cost;
            track.owned++;
            state.totalTracksBought++;
            track.cost = Math.round(track.cost * 1.15);
            updateUI();
        }
    };

    // Rebirth Actions
    rebirthBtn.addEventListener('click', () => {
        let rCost = getRebirthCost();
        if (state.beats >= rCost) {
            state.beats = 0;
            state.totalTracksBought = 0;
            state.rebirths++;

            clickingUpgrades.forEach(u => {
                u.owned = 0;
                u.cost = Math.round(u.cost / Math.pow(1.15, u.owned)); // Approximate reset to original
            });
            // Force reset completely to baseline values
            clickingUpgrades[0].cost = 10; clickingUpgrades[1].cost = 80; clickingUpgrades[2].cost = 400;
            clickingUpgrades[3].cost = 2500; clickingUpgrades[4].cost = 15000; clickingUpgrades[5].cost = 90000;
            clickingUpgrades[6].cost = 550000; clickingUpgrades[7].cost = 3500000; clickingUpgrades[8].cost = 24000000;
            clickingUpgrades[10].cost = 1500000000; clickingUpgrades[11].cost = 12000000000; clickingUpgrades[12].cost = 95000000000;
            clickingUpgrades[13].cost = 800000000000; clickingUpgrades[14].cost = 7500000000000;

            backgroundTracks.forEach(t => { t.owned = 0; });
            backgroundTracks[0].cost = 15; backgroundTracks[1].cost = 100; backgroundTracks[2].cost = 500;
            backgroundTracks[3].cost = 3000; backgroundTracks[4].cost = 10000; backgroundTracks[5].cost = 60000;
            backgroundTracks[6].cost = 350000; backgroundTracks[7].cost = 2000000; backgroundTracks[8].cost = 15000000;
            backgroundTracks[9].cost = 100000000; backgroundTracks[11].cost = 4000000000; backgroundTracks[12].cost = 25000000000;
            backgroundTracks[13].cost = 150000000000; backgroundTracks[14].cost = 1000000000000; backgroundTracks[15].cost = 8500000000000;
            backgroundTracks[16].cost = 70000000000000; backgroundTracks[17].cost = 600000000000000;

            saveGame();
            updateUI();
            alert("Rebirth Complete! Your global production power has multiplied!");
        }
    });

    // Save Mechanism
    function saveGame() {
        let saveData = {
            state: state,
            clickingUpgrades: clickingUpgrades.map(u => ({id: u.id, owned: u.owned, cost: u.cost})),
            backgroundTracks: backgroundTracks.map(t => ({id: t.id, owned: t.owned, cost: t.cost})),
            achievements: achievements.map(a => ({id: a.id, unlocked: a.unlocked}))
        };
        localStorage.setItem('musicClicker_save', JSON.stringify(saveData));
    }

    function loadGame() {
        let raw = localStorage.getItem('musicClicker_save');
        if(raw) {
            try {
                let parsed = JSON.parse(raw);
                if(parsed.state) state = parsed.state;
                if(parsed.clickingUpgrades) {
                    parsed.clickingUpgrades.forEach(saved => {
                        let original = clickingUpgrades.find(u => u.id === saved.id);
                        if(original) { original.owned = saved.owned; original.cost = saved.cost; }
                    });
                }
                if(parsed.backgroundTracks) {
                    parsed.backgroundTracks.forEach(saved => {
                        let original = backgroundTracks.find(t => t.id === saved.id);
                        if(original) { original.owned = saved.owned; original.cost = saved.cost; }
                    });
                }
                if(parsed.achievements) {
                    parsed.achievements.forEach(saved => {
                        let original = achievements.find(a => a.id === saved.id);
                        if(original) original.unlocked = saved.unlocked;
                    });
                }
            } catch(e) { console.error("Error loading save file data: ", e); }
        }
    }

    saveBtn.addEventListener('click', () => {
        saveGame();
        alert("Game saved to local browser data successfully!");
    });

    // Cheats Panel System
    submitCodeBtn.addEventListener('click', () => {
        const code = secretCodeInput.value.trim();
        if(code === 'freebeats') {
            state.beats += 5000;
            alert('Code accepted! Added 5,000 beats.');
        } else if(code === 'm4tr1x') {
            cheats.active = true;
            cheats.matrixRain = true;
            gameContainer.classList.add('matrix-mode');
            document.getElementById('matrixCanvas').style.display = 'block';
            startMatrixRain();
            alert('The Matrix has loaded... Code interface initialized.');
        } else if(code === 'ACXx!11111') {
            cheats.active = true;
            cheats.bpc_inject += 50000000;
            cheats.bps_inject += 1000000000;
            alert('God-Tier Cheat Injected: +50M BPC, +1B BPS!');
        } else if(code === 'M34(!)') {
            cheats.active = true;
            cheats.bpc_inject += 999999999999;
            cheats.bps_inject += 999999999999;
            alert('Reality Collapsed: +999.9B BPC & BPS Injected!');
        } else {
            alert('Invalid secret code format.');
        }
        secretCodeInput.value = '';
        updateUI();
    });

    realityBtn.addEventListener('click', () => {
        cheats.active = false;
        cheats.matrixRain = false;
        cheats.bpc_inject = 0;
        cheats.bps_inject = 0;
        gameContainer.classList.remove('matrix-mode');
        document.getElementById('matrixCanvas').style.display = 'none';
        updateUI();
        alert('Back to normal reality. Cheat modifications disabled.');
    });

    // Matrix Rain Effect Core
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    let matrixInterval = null;

    function startMatrixRain() {
        if(matrixInterval) clearInterval(matrixInterval);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=<>!%";
        const alphabet = katakana.split("");

        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        const draw = () => {
            ctx.fillStyle = 'rgba(18, 18, 18, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };
        matrixInterval = setInterval(draw, 30);
    }

    window.addEventListener('resize', () => {
        if(cheats.matrixRain) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
    });

    // Idle Generation Matrix Loop
    setInterval(() => {
        let mult = getMultiplier();
        let currentBPS = (computeBaseBPS() * mult) + cheats.bps_inject;
        if (currentBPS > 0) {
            state.beats += currentBPS;
            updateUI();
        }
    }, 1000);

    initUI();
</script>
</body>
</html>
