<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Music Clicker</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #ffffff;
            --accent-color: #e94560;
            --panel-bg: #16213e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease;
        }

        body.matrix-mode {
            --bg-color: #000000;
            --text-color: #00ff00;
            --accent-color: #008f11;
            --panel-bg: #0d1f0d;
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .score-display {
            font-size: 2.5rem;
            margin: 20px 0;
            font-weight: bold;
        }

        .click-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .matrix-mode .click-btn {
            color: #00ff00;
            border: 2px solid #00ff00;
            background: transparent;
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }

        .upgrade-item:last-child {
            border-bottom: none;
        }

        .buy-btn {
            background-color: #0f3460;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .matrix-mode .buy-btn {
            border: 1px solid #00ff00;
            background: transparent;
            color: #00ff00;
        }

        .buy-btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .secret-input {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
        }

        .back-btn {
            display: none;
            margin-top: 20px;
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="game-title">🎵 Beat Clicker 🎵</h1>
        
        <div class="score-display">Beats: <span id="score">0</span></div>
        <div style="margin-bottom: 5px;">Beats Per Second (BPS): <span id="bps">0</span></div>
        <div style="margin-bottom: 15px; opacity: 0.8;">Beats Per Click (BPC): +<span id="bpc">1</span></div>
        
        <button class="click-btn" id="click-trigger" onclick="clickBeats()">DROP THE BEAT!</button>

        <div class="panel">
            <h3>Buy & Unlock Upgrades</h3>
            <div id="upgrades-container"></div>
        </div>

        <div id="secret-section">
            <p>Enter Secret Code:</p>
            <input type="password" id="matrix-code" class="secret-input" placeholder="???" oninput="checkCode()">
        </div>

        <button id="back-button" class="back-btn" onclick="exitMatrixMode()">⬅ Go Back to Reality</button>
    </div>

    <script>
        let score = 0;
        let beatsPerSecond = 0;
        let beatsPerClick = 1;
        let currentAudio = null;
        let lastPlayedUrl = "";
        let synthCtx = null;

        const upgrades = [
            { id: 1, name: "Golden Finger Tapes", cost: 10, value: 1, type: "click", count: 0, url: "" },
            { id: 2, name: "Upbeat Synth Theme", cost: 15, value: 1, type: "bps", count: 0, url: "https://wikimedia.org" },
            { id: 3, name: "Heavy Mechanical Switches", cost: 80, value: 5, type: "click", count: 0, url: "" },
            { id: 4, name: "Acoustic Funk Groove", cost: 100, value: 5, type: "bps", count: 0, url: "https://wikimedia.org" },
            { id: 5, name: "Club Techno Pulse", cost: 500, value: 25, type: "bps", count: 0, url: "https://wikimedia.org" },
            { id: 6, name: "Fast Breakbeat Energy", cost: 3000, value: 100, type: "bps", count: 0, url: "https://wikimedia.org" },
            { id: 7, name: "Cyber Arpeggio Overdrive", cost: 10000, value: 500, type: "bps", count: 0, url: "https://wikimedia.org" }
        ];

        function initGame() {
            const container = document.getElementById('upgrades-container');
            if (!container) return;
            
            let htmlContent = "";
            upgrades.forEach(up => {
                let typeText = up.type === "click" ? `+${up.value} Per Click` : `+${up.value} BPS`;
                htmlContent += `
                    <div class="upgrade-item" id="item-${up.id}">
                        <div>
                            <strong>${up.name}</strong><br>
                            <small>${typeText} | Owned: <span id="count-${up.id}">0</span></small>
                        </div>
                        <button class="buy-btn" id="btn-${up.id}" onclick="buyUpgrade(${up.id})">
                            Cost: ${up.cost}
                        </button>
                    </div>
                `;
            });
            container.innerHTML = htmlContent;
            updateUI();
        }

        function playClickSound() {
            try {
                if (!synthCtx) {
                    synthCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                let osc = synthCtx.createOscillator();
                let gain = synthCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, synthCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, synthCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.3, synthCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, synthCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(synthCtx.destination);
                
                osc.start();
                osc.stop(synthCtx.currentTime + 0.04);
            } catch (error) {}
        }

        function clickBeats() {
            playClickSound();
            const multiplier = document.body.classList.contains('matrix-mode') ? 10 : 1;
            score += (beatsPerClick * multiplier);
            updateUI();
        }

        function buyUpgrade(id) {
            const upgrade = upgrades.find(up => up.id === id);
            if (!upgrade) return;

            if (score >= upgrade.cost) {
                score -= upgrade.cost;
                upgrade.count++;
                upgrade.cost = Math.floor(upgrade.cost * 1.15);
                
                if (upgrade.type === "click") {
                    calculateBPC();
                } else {
                    calculateBPS();
                    if (upgrade.url) {
                        lastPlayedUrl = upgrade.url; 
                        playTrack(upgrade.url); 
                    }
                }
                updateUI();
            }
        }

        function playTrack(url) {
            if (currentAudio) {
                currentAudio.pause();
            }
            currentAudio = new Audio(url);
            currentAudio.loop = true;
            currentAudio.volume = 1.0; 
            currentAudio.play().catch(e => console.log("Audio waiting for active interaction."));
        }

        function calculateBPS() {
            beatsPerSecond = upgrades.reduce((total, up) => {
                return up.type === "bps" ? total + (up.count * up.value) : total;
            }, 0);
        }

        function calculateBPC() {
            beatsPerClick = 1 + upgrades.reduce((total, up) => {
                return up.type === "click" ? total + (up.count * up.value) : total;
            }, 0);
        }

        function updateUI() {
            document.getElementById('score').innerText = Math.floor(score);
            document.getElementById('bps').innerText = beatsPerSecond;
            document.getElementById('bpc').innerText = beatsPerClick;

            upgrades.forEach(up => {
                const countLabel = document.getElementById(`count-${up.id}`);
                const btn = document.getElementById(`btn-${up.id}`);
                if (countLabel) countLabel.innerText = up.count;
                if (btn) {
                    btn.innerText = `Cost: ${up.cost}`;
                    btn.disabled = score < up.cost;
