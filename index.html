<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bytes Clicker - MOG52.5 Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .stat-box {
            font-size: 1.2rem;
            margin: 15px 0;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            word-wrap: break-word;
        }
        .big-number {
            font-weight: bold;
            color: #4ade80;
            font-size: 1.4rem;
        }
        #click-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            margin: 20px 0;
            width: 100%;
        }
        #click-btn:hover {
            background-color: #1d4ed8;
        }
        #click-btn:active {
            transform: scale(0.98);
        }
        .dev-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #334155;
        }
        .dev-input {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            width: 60%;
            margin-right: 10px;
            box-sizing: border-box;
        }
        .dev-btn {
            background-color: #475569;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .dev-btn:hover {
            background-color: #64748b;
        }
        .notification {
            margin-top: 10px;
            font-size: 0.9rem;
            min-height: 20px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bytes Clicker</h1>
    <p>Click your way to infinity!</p>
    
    <div class="stat-box">
        Bytes: <span id="bytes-display" class="big-number">0</span>
    </div>
    <div class="stat-box">
        Bytes Per Click (BPC): <span id="bpc-display">1</span><br>
        Bytes Per Second (BPS): <span id="bps-display">0</span>
    </div>

    <button id="click-btn">CLICK ME</button>

    <div class="dev-section">
        <h3>Developer Code</h3>
        <input type="text" id="code-input" class="dev-input" placeholder="Enter dev code...">
        <button id="submit-code" class="dev-btn">Apply</button>
        <div id="notification" class="notification"></div>
    </div>
</div>

<script>
    // Using BigInt to support the massively large values requested without floating point breakdown
    let bytes = 0n;
    let bpc = 1n;
    let bps = 0n;

    const bytesDisplay = document.getElementById('bytes-display');
    const bpcDisplay = document.getElementById('bpc-display');
    const bpsDisplay = document.getElementById('bps-display');
    const clickBtn = document.getElementById('click-btn');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('submit-code');
    const notification = document.getElementById('notification');

    function formatNumber(num) {
        let str = num.toString();
        if (str.length > 15) {
            return str.substring(0, 1) + '.' + str.substring(1, 5) + 'e+' + (str.length - 1);
        }
        return str;
    }

    function updateDisplay() {
        bytesDisplay.textContent = formatNumber(bytes);
        bpcDisplay.textContent = formatNumber(bpc);
        bpsDisplay.textContent = formatNumber(bps);
    }

    clickBtn.addEventListener('click', () => {
        bytes += bpc;
        updateDisplay();
    });

    submitBtn.addEventListener('click', () => {
        const code = codeInput.value.trim();
        if (code === 'MOG52.5') {
            // Values requested by user:
            // 999999999999999999999999999999999999999999999999999999999 bpc (57 nines)
            // 9999999999999999999999999999999999999999999999999999999999999999999 bps (67 nines)
            bpc = BigInt("999999999999999999999999999999999999999999999999999999999");
            bps = BigInt("9999999999999999999999999999999999999999999999999999999999999999999");
            
            notification.className = "notification success";
            notification.textContent = "Dev Code Activated! Max stats granted.";
            updateDisplay();
        } else {
            notification.className = "notification error";
            notification.textContent = "Invalid Developer Code.";
        }
        codeInput.value = '';
    });

    // Game Loop for BPS
    setInterval(() => {
        if (bps > 0n) {
            bytes += bps;
            updateDisplay();
        }
    }, 1000);

    updateDisplay();
</script>

</body>
</html>
